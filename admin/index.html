<!DOCTYPE html>
<html lang="id" x-data="cmsApp()" :class="{ 'dark': dark }">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Cyberind CMS — Admin</title>

    <meta name="description"
        content="Cyberind.id Content Management System">

    <link rel="icon"
        href="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine -->
    <script defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

    <style>

        :root {
            --red: #ef4444;
            --red-dark: #dc2626;
            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #171717;
            --muted: #737373;
            --border: #e5e5e5;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .dark body {
            background: #090909;
            color: #f5f5f5;
        }

        .glass {
            background: rgba(255,255,255,.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(0,0,0,.06);
        }

        .dark .glass {
            background: rgba(20,20,20,.82);
            border-color: rgba(255,255,255,.08);
        }

        .sidebar {
            width: 260px;
            transition: .25s ease;
        }

        .main {
            margin-left: 260px;
            transition: .25s ease;
        }

        @media(max-width: 900px) {

            .sidebar {
                transform: translateX(-100%);
                position: fixed;
                z-index: 100;
                height: 100vh;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }
        }

        .editor {
            min-height: 430px;
            outline: none;
            line-height: 1.8;
        }

        .editor:empty:before {
            content: attr(data-placeholder);
            color: #a3a3a3;
            pointer-events: none;
        }

        .editor h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 1.5rem 0 .7rem;
        }

        .editor h3 {
            font-size: 1.45rem;
            font-weight: 700;
            margin: 1.3rem 0 .6rem;
        }

        .editor h4 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 1.1rem 0 .5rem;
        }

        .editor p {
            margin: .8rem 0;
        }

        .editor ul {
            list-style: disc;
            padding-left: 1.8rem;
        }

        .editor ol {
            list-style: decimal;
            padding-left: 1.8rem;
        }

        .editor blockquote {
            border-left: 4px solid var(--red);
            padding: .7rem 1rem;
            margin: 1rem 0;
            background: rgba(239,68,68,.06);
            font-style: italic;
        }

        .editor pre {
            background: #111;
            color: #f5f5f5;
            padding: 1rem;
            border-radius: 10px;
            overflow-x: auto;
            font-family: monospace;
        }

        .editor img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 1rem 0;
        }

        .editor iframe {
            width: 100%;
            min-height: 350px;
            border: 0;
            border-radius: 12px;
            margin: 1rem 0;
        }

        .editor a {
            color: #ef4444;
            text-decoration: underline;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e5e5e5;
            background: white;
            transition: .15s;
        }

        .tool-btn:hover {
            background: #f5f5f5;
            border-color: #d4d4d4;
        }

        .dark .tool-btn {
            background: #171717;
            border-color: #333;
            color: #eee;
        }

        .dark .tool-btn:hover {
            background: #262626;
        }

        .tool-separator {
            width: 1px;
            height: 28px;
            background: #ddd;
            margin: 4px;
        }

        .dark .tool-separator {
            background: #333;
        }

        .toast {
            animation: toastIn .25s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-bg {
            background: rgba(0,0,0,.65);
            backdrop-filter: blur(5px);
        }

        .scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #525252;
            border-radius: 20px;
        }

        .prose-content {
            line-height: 1.85;
        }

        .prose-content h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 2rem;
        }

        .prose-content h3 {
            font-size: 1.45rem;
            font-weight: 700;
            margin-top: 1.5rem;
        }

        .prose-content h4 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 1.2rem;
        }

        .prose-content p {
            margin: 1rem 0;
        }

        .prose-content ul {
            list-style: disc;
            padding-left: 2rem;
        }

        .prose-content ol {
            list-style: decimal;
            padding-left: 2rem;
        }

        .prose-content blockquote {
            border-left: 4px solid #ef4444;
            padding-left: 1rem;
            font-style: italic;
            background: rgba(239,68,68,.05);
            padding-top: .5rem;
            padding-bottom: .5rem;
        }

        .prose-content img {
            max-width: 100%;
            border-radius: 12px;
        }

        .prose-content iframe {
            width: 100%;
            min-height: 400px;
            border: 0;
            border-radius: 12px;
        }

        .prose-content pre {
            background: #111;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            overflow-x: auto;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

    </style>
</head>


<body>

<div x-show="loading"
    x-cloak
    class="fixed inset-0 z-[999] flex items-center justify-center bg-black/70">

    <div class="text-center text-white">

        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-red-500 mb-4"></i>

        <p>Memuat Cyberind CMS...</p>

    </div>

</div>


<!-- ================= LOGIN ================= -->

<template x-if="!authenticated">

    <div class="min-h-screen flex items-center justify-center px-5">

        <div class="w-full max-w-md">

            <div class="text-center mb-8">

                <img
                    src="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png"
                    class="w-20 h-20 mx-auto mb-5 object-contain">

                <h1 class="text-3xl font-bold">
                    Cyberind <span class="text-red-500">CMS</span>
                </h1>

                <p class="text-neutral-500 mt-2">
                    Content Management System
                </p>

            </div>


            <div class="glass rounded-2xl p-7 shadow-xl">

                <h2 class="text-xl font-bold mb-6">
                    Login Administrator
                </h2>

                <form @submit.prevent="login">

                    <label class="block text-sm font-medium mb-2">
                        Email
                    </label>

                    <input
                        x-model="loginForm.email"
                        type="email"
                        required
                        autocomplete="username"
                        class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 outline-none focus:ring-2 focus:ring-red-500 mb-5"
                        placeholder="admin@example.com">


                    <label class="block text-sm font-medium mb-2">
                        Password
                    </label>

                    <div class="relative">

                        <input
                            x-model="loginForm.password"
                            :type="showPassword ? 'text' : 'password'"
                            required
                            autocomplete="current-password"
                            class="w-full px-4 py-3 pr-12 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 outline-none focus:ring-2 focus:ring-red-500"
                            placeholder="••••••••">

                        <button
                            type="button"
                            @click="showPassword=!showPassword"
                            class="absolute right-4 top-3 text-neutral-500">

                            <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>

                        </button>

                    </div>


                    <div
                        x-show="loginError"
                        class="mt-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 text-sm"
                        x-text="loginError">
                    </div>


                    <button
                        type="submit"
                        :disabled="loggingIn"
                        class="w-full mt-6 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold transition disabled:opacity-50">

                        <i
                            :class="loggingIn ? 'fa-solid fa-circle-notch fa-spin' : 'fa-solid fa-right-to-bracket'"
                            class="mr-2">
                        </i>

                        <span x-text="loggingIn ? 'Memproses...' : 'Masuk CMS'"></span>

                    </button>

                </form>


                <div class="text-center mt-6 text-xs text-neutral-500">

                    Cyberind.id · Independent Cyber Team

                </div>

            </div>

        </div>

    </div>

</template>


<!-- ================= APP ================= -->

<template x-if="authenticated">

<div>


    <!-- SIDEBAR -->

    <aside
        class="sidebar fixed top-0 left-0 bottom-0 bg-white dark:bg-neutral-950 border-r dark:border-neutral-800 flex flex-col"
        :class="{ 'open': mobileMenu }">

        <div class="p-6 border-b dark:border-neutral-800">

            <div class="flex items-center gap-3">

                <img
                    src="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png"
                    class="w-11 h-11 object-contain">

                <div>

                    <div class="font-bold">
                        Cyberind
                        <span class="text-red-500">CMS</span>
                    </div>

                    <div class="text-xs text-neutral-500">
                        Admin Panel
                    </div>

                </div>

            </div>

        </div>


        <nav class="flex-1 p-4 overflow-y-auto scrollbar">

            <button
                @click="page='dashboard'; mobileMenu=false"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 transition"
                :class="page==='dashboard'
                    ? 'bg-red-500 text-white'
                    : 'hover:bg-neutral-100 dark:hover:bg-neutral-900'">

                <i class="fa-solid fa-chart-line w-5"></i>

                Dashboard

            </button>


            <button
                @click="page='articles'; mobileMenu=false"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 transition"
                :class="page==='articles'
                    ? 'bg-red-500 text-white'
                    : 'hover:bg-neutral-100 dark:hover:bg-neutral-900'">

                <i class="fa-solid fa-newspaper w-5"></i>

                Artikel

            </button>


            <button
                @click="newArticle(); mobileMenu=false"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 hover:bg-neutral-100 dark:hover:bg-neutral-900">

                <i class="fa-solid fa-pen-to-square w-5"></i>

                Tulis Artikel

            </button>


            <div class="mt-6 mb-2 px-4 text-xs uppercase tracking-wider text-neutral-400">

                Website

            </div>


            <a
                href="/blog/"
                target="_blank"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 hover:bg-neutral-100 dark:hover:bg-neutral-900">

                <i class="fa-solid fa-globe w-5"></i>

                Blog

                <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-auto"></i>

            </a>


            <a
                href="/"
                target="_blank"
                class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-900">

                <i class="fa-solid fa-house w-5"></i>

                Homepage

                <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-auto"></i>

            </a>

        </nav>


        <div class="p-4 border-t dark:border-neutral-800">

            <div class="flex items-center gap-3 mb-4">

                <div
                    class="w-9 h-9 rounded-full bg-red-500 text-white flex items-center justify-center">

                    <i class="fa-solid fa-user-shield"></i>

                </div>

                <div class="min-w-0">

                    <div
                        class="font-semibold text-sm truncate"
                        x-text="currentUser?.email || 'Administrator'">
                    </div>

                    <div class="text-xs text-neutral-500">
                        Administrator
                    </div>

                </div>

            </div>


            <button
                @click="logout"
                class="w-full py-2.5 rounded-xl border dark:border-neutral-700 hover:bg-red-500 hover:text-white hover:border-red-500 transition">

                <i class="fa-solid fa-right-from-bracket mr-2"></i>

                Logout

            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main min-h-screen">


        <!-- TOPBAR -->

        <header
            class="sticky top-0 z-40 glass border-b dark:border-neutral-800">

            <div class="px-5 md:px-8 py-4 flex items-center justify-between">

                <div class="flex items-center gap-4">

                    <button
                        @click="mobileMenu=!mobileMenu"
                        class="md:hidden w-10 h-10 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800">

                        <i class="fa-solid fa-bars"></i>

                    </button>


                    <div>

                        <h1
                            class="font-bold text-lg"
                            x-text="pageTitle">
                        </h1>

                        <p class="text-xs text-neutral-500 hidden sm:block">
                            Kelola konten Cyberind.id
                        </p>

                    </div>

                </div>


                <div class="flex items-center gap-2">

                    <button
                        @click="dark=!dark; localStorage.setItem('cyberind-dark',dark)"
                        class="w-10 h-10 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800">

                        <i
                            :class="dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon'">
                        </i>

                    </button>


                    <a
                        href="/blog/"
                        target="_blank"
                        class="hidden sm:flex w-10 h-10 rounded-xl items-center justify-center hover:bg-neutral-100 dark:hover:bg-neutral-800">

                        <i class="fa-solid fa-globe"></i>

                    </a>

                </div>

            </div>

        </header>


        <!-- CONTENT -->

        <div class="p-5 md:p-8">


            <!-- DASHBOARD -->

            <template x-if="page==='dashboard'">

                <div>

                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-7">

                        <div>

                            <h2 class="text-2xl font-bold">
                                Dashboard
                            </h2>

                            <p class="text-neutral-500 mt-1">
                                Selamat datang kembali di Cyberind CMS.
                            </p>

                        </div>

                        <button
                            @click="newArticle()"
                            class="px-5 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold">

                            <i class="fa-solid fa-plus mr-2"></i>

                            Artikel Baru

                        </button>

                    </div>


                    <!-- STATS -->

                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">


                        <div class="glass rounded-2xl p-5">

                            <div class="flex items-center justify-between">

                                <span class="text-neutral-500">
                                    Total Artikel
                                </span>

                                <i class="fa-solid fa-newspaper text-red-500"></i>

                            </div>

                            <div
                                class="text-3xl font-bold mt-3"
                                x-text="articles.length">
                            </div>

                        </div>


                        <div class="glass rounded-2xl p-5">

                            <div class="flex items-center justify-between">

                                <span class="text-neutral-500">
                                    Published
                                </span>

                                <i class="fa-solid fa-circle-check text-green-500"></i>

                            </div>

                            <div
                                class="text-3xl font-bold mt-3"
                                x-text="publishedCount">
                            </div>

                        </div>


                        <div class="glass rounded-2xl p-5">

                            <div class="flex items-center justify-between">

                                <span class="text-neutral-500">
                                    Draft
                                </span>

                                <i class="fa-solid fa-file text-yellow-500"></i>

                            </div>

                            <div
                                class="text-3xl font-bold mt-3"
                                x-text="draftCount">
                            </div>

                        </div>


                        <div class="glass rounded-2xl p-5">

                            <div class="flex items-center justify-between">

                                <span class="text-neutral-500">
                                    Views
                                </span>

                                <i class="fa-solid fa-eye text-blue-500"></i>

                            </div>

                            <div
                                class="text-3xl font-bold mt-3"
                                x-text="totalViews">
                            </div>

                        </div>

                    </div>


                    <!-- RECENT -->

                    <div class="glass rounded-2xl overflow-hidden">

                        <div class="p-5 border-b dark:border-neutral-800 flex items-center justify-between">

                            <h3 class="font-bold">
                                Artikel Terbaru
                            </h3>

                            <button
                                @click="page='articles'"
                                class="text-sm text-red-500">

                                Lihat Semua

                            </button>

                        </div>


                        <div class="divide-y dark:divide-neutral-800">

                            <template
                                x-for="article in articles.slice(0,5)"
                                :key="article.id">

                                <div class="p-5 flex items-center gap-4">

                                    <div class="w-16 h-12 rounded-lg bg-neutral-100 dark:bg-neutral-800 overflow-hidden shrink-0">

                                        <template x-if="article.featured_image">

                                            <img
                                                :src="article.featured_image"
                                                class="w-full h-full object-cover">

                                        </template>

                                        <template x-if="!article.featured_image">

                                            <div class="w-full h-full flex items-center justify-center">

                                                <i class="fa-solid fa-newspaper text-neutral-400"></i>

                                            </div>

                                        </template>

                                    </div>


                                    <div class="min-w-0 flex-1">

                                        <div
                                            class="font-semibold truncate"
                                            x-text="article.title">
                                        </div>

                                        <div class="text-xs text-neutral-500 mt-1">

                                            <span x-text="formatDate(article.created_at)"></span>

                                            ·

                                            <span x-text="article.author_name"></span>

                                        </div>

                                    </div>


                                    <span
                                        class="hidden sm:inline-flex items-center gap-2 text-xs px-3 py-1.5 rounded-full"
                                        :class="article.status==='published'
                                            ? 'bg-green-500/10 text-green-500'
                                            : 'bg-yellow-500/10 text-yellow-600'">

                                        <span
                                            class="status-dot"
                                            :class="article.status==='published'
                                                ? 'bg-green-500'
                                                : 'bg-yellow-500'">
                                        </span>

                                        <span
                                            x-text="article.status==='published' ? 'Published' : 'Draft'">
                                        </span>

                                    </span>

                                </div>

                            </template>


                            <template x-if="articles.length===0">

                                <div class="p-10 text-center text-neutral-500">

                                    Belum ada artikel.

                                </div>

                            </template>

                        </div>

                    </div>

                </div>

            </template>


            <!-- ARTICLES -->

            <template x-if="page==='articles'">

                <div>

                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">

                        <div>

                            <h2 class="text-2xl font-bold">
                                Artikel
                            </h2>

                            <p class="text-neutral-500">
                                Kelola semua artikel Cyberind Journal.
                            </p>

                        </div>

                        <button
                            @click="newArticle()"
                            class="px-5 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold">

                            <i class="fa-solid fa-plus mr-2"></i>

                            Tulis Artikel

                        </button>

                    </div>


                    <!-- FILTER -->

                    <div class="glass rounded-2xl p-4 mb-5 flex flex-col md:flex-row gap-3">

                        <div class="relative flex-1">

                            <i class="fa-solid fa-search absolute left-4 top-3.5 text-neutral-400"></i>

                            <input
                                x-model="search"
                                type="text"
                                placeholder="Cari artikel..."
                                class="w-full pl-11 pr-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 outline-none focus:ring-2 focus:ring-red-500">

                        </div>


                        <select
                            x-model="statusFilter"
                            class="px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 outline-none">

                            <option value="all">
                                Semua Status
                            </option>

                            <option value="published">
                                Published
                            </option>

                            <option value="draft">
                                Draft
                            </option>

                        </select>

                    </div>


                    <!-- TABLE -->

                    <div class="glass rounded-2xl overflow-hidden">

                        <div class="overflow-x-auto">

                            <table class="w-full text-left">

                                <thead class="bg-neutral-50 dark:bg-neutral-900 border-b dark:border-neutral-800">

                                    <tr>

                                        <th class="px-5 py-4 text-sm">
                                            Artikel
                                        </th>

                                        <th class="px-5 py-4 text-sm">
                                            Kategori
                                        </th>

                                        <th class="px-5 py-4 text-sm">
                                            Status
                                        </th>

                                        <th class="px-5 py-4 text-sm">
                                            Views
                                        </th>

                                        <th class="px-5 py-4 text-sm">
                                            Tanggal
                                        </th>

                                        <th class="px-5 py-4 text-sm text-right">
                                            Aksi
                                        </th>

                                    </tr>

                                </thead>


                                <tbody class="divide-y dark:divide-neutral-800">

                                    <template
                                        x-for="article in filteredArticles"
                                        :key="article.id">

                                        <tr class="hover:bg-neutral-50 dark:hover:bg-neutral-900/70">

                                            <td class="px-5 py-4 min-w-[280px]">

                                                <div class="flex gap-3">

                                                    <div class="w-16 h-12 rounded-lg overflow-hidden bg-neutral-100 dark:bg-neutral-800 shrink-0">

                                                        <template x-if="article.featured_image">

                                                            <img
                                                                :src="article.featured_image"
                                                                class="w-full h-full object-cover">

                                                        </template>

function sanitizeHTML(html) {

    if (!window.DOMPurify) {
        return html;
    }

    const clean = DOMPurify.sanitize(
        html || '',
        {
            USE_PROFILES: {
                html: true
            },

            ADD_TAGS: [
                'iframe'
            ],

            ADD_ATTR: [
                'allow',
                'allowfullscreen',
                'frameborder',
                'height',
                'loading',
                'referrerpolicy',
                'src',
                'title',
                'width'
            ],

            FORBID_TAGS: [
                'script',
                'object',
                'embed',
                'form',
                'input',
                'button',
                'textarea',
                'style',
                'link',
                'meta'
            ]
        }
    );

    return clean;
}


function safeURL(value) {

    try {

        const url =
            new URL(value);

        if (
            url.protocol !== 'https:' &&
            url.protocol !== 'http:' &&
            url.protocol !== 'mailto:' &&
            url.protocol !== 'tel:'
        ) {

            return null;

        }

        return url.href;

    } catch {

        return null;

    }

}


function safeHttpsURL(value) {

    try {

        const url =
            new URL(value);

        if (url.protocol !== 'https:') {
            return null;
        }

        return url;

    } catch {

        return null;

    }

}


function isAllowedEmbedHost(hostname) {

    const host =
        hostname.toLowerCase();

    const allowed = [

        'youtube.com',
        'www.youtube.com',

        'youtube-nocookie.com',
        'www.youtube-nocookie.com',

        'youtu.be',

        'vimeo.com',
        'www.vimeo.com',
        'player.vimeo.com',

        'open.spotify.com',

        'soundcloud.com',
        'www.soundcloud.com',
        'w.soundcloud.com',

        'maps.google.com',
        'www.google.com',

        'codepen.io',
        'www.codepen.io',

        'codesandbox.io',
        'www.codesandbox.io',

        'gist.github.com'

    ];

    return allowed.some(
        item =>
            host === item ||
            host.endsWith('.' + item)
    );

}


function youtubeEmbed(url) {

    try {

        const u =
            new URL(url);

        let id = '';

        if (u.hostname === 'youtu.be') {

            id =
                u.pathname.replace('/', '');

        } else {

            id =
                u.searchParams.get('v') || '';

            if (
                u.pathname.startsWith('/shorts/')
            ) {

                id =
                    u.pathname.split('/shorts/')[1];

            }

            if (
                u.pathname.startsWith('/embed/')
            ) {

                id =
                    u.pathname.split('/embed/')[1];

            }

        }

        id =
            id.split(/[?&#]/)[0];

        if (!/^[A-Za-z0-9_-]{6,}$/.test(id)) {
            return null;
        }

        return `https://www.youtube-nocookie.com/embed/${id}`;

    } catch {

        return null;

    }

}


function vimeoEmbed(url) {

    try {

        const u =
            new URL(url);

        const match =
            u.pathname.match(/\/(\d+)/);

        if (!match) {
            return null;
        }

        return `https://player.vimeo.com/video/${match[1]}`;

    } catch {

        return null;

    }

}


function spotifyEmbed(url) {

    try {

        const u =
            new URL(url);

        if (
            u.hostname !== 'open.spotify.com'
        ) {

            return null;

        }

        const parts =
            u.pathname
                .split('/')
                .filter(Boolean);

        if (
            parts.length < 2
        ) {

            return null;

        }

        const type =
            parts[0];

        const id =
            parts[1];

        const allowed =
            [
                'track',
                'album',
                'playlist',
                'episode',
                'show',
                'artist'
            ];

        if (!allowed.includes(type)) {
            return null;
        }

        return `https://open.spotify.com/embed/${type}/${id}`;

    } catch {

        return null;

    }

}


function soundcloudEmbed(url) {

    const safe =
        safeHttpsURL(url);

    if (!safe) {
        return null;
    }

    if (
        ![
            'soundcloud.com',
            'www.soundcloud.com'
        ].includes(safe.hostname)
    ) {

        return null;

    }

    return (
        'https://w.soundcloud.com/player/?url=' +
        encodeURIComponent(safe.href) +
        '&color=%23ef4444&auto_play=false&hide_related=false&show_comments=true'
    );

}


function mapsEmbed(url) {

    const safe =
        safeHttpsURL(url);

    if (!safe) {
        return null;
    }

    if (
        safe.hostname === 'maps.google.com'
    ) {

        return safe.href;

    }

    if (
        safe.hostname === 'www.google.com' &&
        safe.pathname.startsWith('/maps')
    ) {

        return safe.href;

    }

    return null;

}


function escapeHTML(value) {

    return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


function slugify(value) {

    return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');

}


function wordCountFromHTML(html) {

    const div =
        document.createElement('div');

    div.innerHTML =
        html || '';

    const text =
        div.textContent || '';

    return text
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;

}

                tags: ''

            };

        },


        newArticle() {

            this.editing =
                false;

            this.form =
                this.emptyForm();

            this.sourceMode =
                false;

            this.page =
                'editor';


            this.$nextTick(
                () => {

                    if (
                        this.$refs.editor
                    ) {

                        this.$refs.editor.innerHTML =
                            '';

                    }

                }
            );

        },


        editArticle(article) {

            this.editing =
                true;

            this.form = {

                id:
                    article.id,

                title:
                    article.title || '',

                slug:
                    article.slug || '',

                excerpt:
                    article.excerpt || '',

                content:
                    article.content || '',

                featured_image:
                    article.featured_image || '',

                category_id:
                    article.category_id || '',

                author_name:
                    article.author_name ||
                    'Cyberind.id',

                status:
                    article.status ||
                    'draft',

                seo_title:
                    article.seo_title || '',

                seo_description:
                    article.seo_description || '',

                views:
                    article.views || 0,

                published_at:
                    article.published_at,

                created_at:
                    article.created_at,

                updated_at:
                    article.updated_at,

                tags: ''

            };


            this.sourceMode =
                false;

            this.page =
                'editor';


            this.$nextTick(
                () => {

                    if (
                        this.$refs.editor
                    ) {

                        this.$refs.editor.innerHTML =
                            sanitizeHTML(
                                this.form.content
                            );

                    }

                    this.loadArticleTags(
                        article.id
                    );

                }
            );

        },


        async loadArticleTags(articleId) {

            const {
                data
            } =
                await supabaseClient
                    .from('article_tags')
                    .select(`
                        tag_id,
                        tags (
                            id,
                            name,
                            slug
                        )
                    `)
                    .eq(
                        'article_id',
                        articleId
                    );


            if (!data) {
                return;
            }

            this.form.tags =
                data
                    .map(
                        row =>
                            row.tags?.name
                    )
                    .filter(Boolean)
                    .join(', ');

        },


        autoSlug() {

            if (
                !this.editing ||
                !this.form.slug
            ) {

                this.form.slug =
                    slugify(
                        this.form.title
                    );

            }

        },


        /* ================= EDITOR ================= */

        saveSelection() {

            const selection =
                window.getSelection();

            if (
                selection &&
                selection.rangeCount
            ) {

                this.selectedRange =
                    selection.getRangeAt(0);

            }

        },


        restoreSelection() {

            if (
                !this.selectedRange
            ) {

                return;

            }

            const selection =
                window.getSelection();

            selection.removeAllRanges();

            selection.addRange(
                this.selectedRange
            );

        },


        editorCommand(
            command,
            value = null
        ) {

            if (this.sourceMode) {
                return;
            }

            this.$refs.editor.focus();

            this.restoreSelection();

            document.execCommand(
                command,
                false,
                value
            );

            this.saveSelection();

        },


        formatBlock(tag) {

            if (!tag) {
                return;
            }

            this.editorCommand(
                'formatBlock',
                tag
            );

        },


        toggleSource() {

            if (!this.sourceMode) {

                this.form.content =
                    this.$refs.editor.innerHTML;

                this.sourceMode =
                    true;

            } else {

                this.sourceMode =
                    false;

                this.$nextTick(
                    () => {

                        this.$refs.editor.innerHTML =
                            sanitizeHTML(
                                this.form.content
                            );

                    }
                );

            }

        },


        /* ================= LINK ================= */

        openLinkModal() {

            this.saveSelection();

            this.linkForm = {

                text:
                    this.getSelectedText(),

                url: '',

                newTab: true,

                nofollow: false

            };

            this.linkModal =
                true;

        },


        getSelectedText() {

            const selection =
                window.getSelection();

            return selection
                ? selection.toString()
                : '';

        },


        insertLink() {

            const url =
                safeURL(
                    this.linkForm.url
                );


            if (!url) {

                this.notify(
                    'URL tidak valid.',
                    'error'
                );

                return;

            }


            this.restoreSelection();

            this.$refs.editor.focus();


            let text =
                this.getSelectedText();


            if (!text) {

                text =
                    this.linkForm.text ||
                    url;

                document.execCommand(
                    'insertHTML',
                    false,
                    `<a href="${escapeHTML(url)}">${escapeHTML(text)}</a>`
                );

            } else {

                document.execCommand(
                    'createLink',
                    false,
                    url
                );

            }


            const links =
                this.$refs.editor
                    .querySelectorAll(
                        'a'
                    );


            links.forEach(
                link => {

                    if (
                        link.getAttribute('href') === url
                    ) {

                        if (
                            this.linkForm.newTab
                        ) {

                            link.target =
                                '_blank';

                        } else {

                            link.removeAttribute(
                                'target'
                            );

                        }


                        let rel = [];


                        if (
                            this.linkForm.newTab
                        ) {

                            rel.push(
                                'noopener'
                            );

                            rel.push(
                                'noreferrer'
                            );

                        }


                        if (
                            this.linkForm.nofollow
                        ) {

                            rel.push(
                                'nofollow'
                            );

                        }


                        if (rel.length) {

                            link.rel =
                                [...new Set(rel)]
                                    .join(' ');

                        } else {

                            link.removeAttribute(
                                'rel'
                            );

                        }

                    }

                }
            );


            this.linkModal =
                false;

            this.saveSelection();

        },


        /* ================= IMAGE ================= */

        openImageModal(
            featured = false
        ) {

            this.imageForFeatured =
                featured;

            this.imageTab =
                'upload';

            this.imageModal =
                true;

        },


        async uploadImage(event) {

            const file =
                event.target.files?.[0];


            if (!file) {
                return;
            }


            const allowed = [
                'image/jpeg',
                'image/png',
                'image/webp',
                'image/gif'
            ];


            if (
                !allowed.includes(
                    file.type
                )
            ) {

                this.notify(
                    'Format gambar tidak didukung.',
                    'error'
                );

                return;

            }


            if (
                file.size >
                5 * 1024 * 1024
            ) {

                this.notify(
                    'Ukuran gambar maksimal 5 MB.',
                    'error'
                );

                return;

            }


            this.uploading =
                true;


            const extension =
                file.name
                    .split('.')
                    .pop()
                    .toLowerCase();


            const path =
                `articles/${crypto.randomUUID()}.${extension}`;


            const {
                error
            } =
                await supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .upload(
                        path,
                        file,
                        {
                            cacheControl:
                                '3600',

                            upsert:
                                false,

                            contentType:
                                file.type
                        }
                    );


            if (error) {

                this.uploading =
                    false;

                this.notify(
                    'Upload gagal: ' +
                    error.message,
                    'error'
                );

                return;

            }


            const {
                data
            } =
                supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .getPublicUrl(
                        path
                    );


            const imageURL =
                data.publicUrl;


            if (
                this.imageForFeatured
            ) {

                this.form.featured_image =
                    imageURL;

            } else {

                this.restoreSelection();

                this.$refs.editor.focus();


                const html =
                    `<p><img src="${escapeHTML(imageURL)}" alt="Cyberind.id"></p>`;


                document.execCommand(
                    'insertHTML',
                    false,
                    html
                );

            }


            this.uploading =
                false;

            this.imageModal =
                false;

            this.notify(
                'Gambar berhasil diupload.'
            );

        },


        insertExternalImage() {

            const url =
                safeHttpsURL(
                    this.externalImage.url
                );


            if (!url) {

                this.notify(
                    'URL gambar harus HTTPS dan valid.',
                    'error'
                );

                return;

            }


            if (
                this.imageForFeatured
            ) {

                this.form.featured_image =
                    url.href;

            } else {

                this.restoreSelection();

                this.$refs.editor.focus();


                const alt =
                    escapeHTML(
                        this.externalImage.alt ||
                        'Cyberind.id'
                    );


                document.execCommand(
                    'insertHTML',
                    false,
                    `<p><img src="${escapeHTML(url.href)}" alt="${alt}" loading="lazy"></p>`
                );

            }


            this.externalImage = {

                url: '',
                alt: ''

            };


            this.imageModal =
                false;

        },


        /* ================= EMBED ================= */

        openEmbedModal() {

            this.saveSelection();

            this.embedForm = {

                provider:
                    'youtube',

                url: ''

            };

            this.embedModal =
                true;

        },


        insertEmbed() {

            const provider =
                this.embedForm.provider;

            const url =
                this.embedForm.url.trim();

            let src =
                null;


            if (
                provider === 'youtube'
            ) {

                src =
                    youtubeEmbed(url);

            }


            if (
                provider === 'vimeo'
            ) {

                src =
                    vimeoEmbed(url);

            }


            if (
                provider === 'spotify'
            ) {

                src =
                    spotifyEmbed(url);

            }


            if (
                provider === 'soundcloud'
            ) {

                src =
                    soundcloudEmbed(url);

            }


            if (
                provider === 'maps'
            ) {

                src =
                    mapsEmbed(url);

            }


            if (
                provider === 'iframe'
            ) {

                try {

                    const u =
                        new URL(url);


                    if (
                        u.protocol !== 'https:' ||
                        !isAllowedEmbedHost(
                            u.hostname
                        )
                    ) {

                        this.notify(
                            'Domain iframe tidak termasuk daftar aman.',
                            'error'
                        );

                        return;

                    }


                    src =
                        u.href;

                } catch {

                    src =
                        null;

                }

            }


            if (!src) {

                this.notify(
                    'URL embed tidak valid atau tidak didukung.',
                    'error'
                );

                return;

            }


            this.restoreSelection();

            this.$refs.editor.focus();


            const title =
                provider === 'youtube'
                    ? 'YouTube'
                    : provider;


            const html = `

                <div class="cyberind-embed" contenteditable="false">

                    <iframe
                        src="${escapeHTML(src)}"
                        title="${escapeHTML(title)}"
                        loading="lazy"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>

                </div>

                <p><br></p>

            `;


            document.execCommand(
                'insertHTML',
                false,
                html
            );


            this.embedModal =
                false;

            this.notify(
                'Embed berhasil ditambahkan.'
            );

        },


        /* ================= CATEGORY ================= */

        async createCategory() {

            const name =
                this.categoryForm.name.trim();

            const slug =
                slugify(
                    this.categoryForm.slug ||
                    name
                );


            if (!name) {

                this.notify(
                    'Nama kategori wajib diisi.',
                    'error'
                );

                return;

            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from('categories')
                    .insert({

                        name,
                        slug

                    })
                    .select()
                    .single();


            if (error) {

                this.notify(
                    error.message,
                    'error'
                );

                return;

            }


            this.categories.push(
                data
            );


            this.form.category_id =
                data.id;


            this.categoryForm = {

                name: '',
                slug: ''

            };


            this.categoryModal =
                false;

            this.notify(
                'Kategori berhasil dibuat.'
            );

        },


        /* ================= PREVIEW ================= */

        previewArticle(article) {

            this.previewData = {

                title:
                    article.title,

                excerpt:
                    article.excerpt,

                content:
                    sanitizeHTML(
                        article.content
                    ),

                featured_image:
                    article.featured_image,

                category:
                    article.categories?.name ||
                    'Cyberind Journal',

                author_name:
                    article.author_name,

                slug:
                    article.slug,

                status:
                    article.status,

                published_at:
                    article.published_at

            };


            this.previewModal =
                true;

        },


        previewCurrent() {

            if (
                this.sourceMode
            ) {

                this.form.content =
                    sanitizeHTML(
                        this.form.content
                    );

            } else {

                this.form.content =
                    sanitizeHTML(
                        this.$refs.editor.innerHTML
                    );

            }


            this.previewData = {

                title:
                    this.form.title,

                excerpt:
                    this.form.excerpt,

                content:
                    sanitizeHTML(
                        this.form.content
                    ),

                featured_image:
                    this.form.featured_image,

                category:
                    this.categories.find(
                        x =>
                            x.id ===
                            this.form.category_id
                    )?.name ||
                    'Cyberind Journal',

                author_name:
                    this.form.author_name,

                slug:
                    this.form.slug,

                status:
                    this.form.status,

                published_at:
                    this.form.published_at

            };


            this.previewModal =
                true;

        },


        /* ================= SAVE ================= */

        async saveArticle() {

            if (
                !this.form.title.trim()
            ) {

                this.notify(
                    'Judul artikel wajib diisi.',
                    'error'
                );

                return;

            }


            if (
                !this.form.slug.trim()
            ) {

                this.form.slug =
                    slugify(
                        this.form.title
                    );

            }


            if (
                !this.form.slug
            ) {

                this.notify(
                    'Slug artikel wajib diisi.',
                    'error'
                );

                return;

            }


            if (
                this.sourceMode
            ) {

                this.form.content =
                    sanitizeHTML(
                        this.form.content
                    );

            } else {

                this.form.content =
                    sanitizeHTML(
                        this.$refs.editor.innerHTML
                    );

            }


            this.saving =
                true;


            const wasPublished =
                this.form.published_at;


            let publishedAt =
                this.form.status ===
                'published'
                    ? (
                        wasPublished ||
                        new Date().toISOString()
                    )
                    : null;


            const payload = {

                title:
                    this.form.title.trim(),

                slug:
                    slugify(
                        this.form.slug
                    ),

                excerpt:
                    this.form.excerpt
                        .trim(),

                content:
                    this.form.content,

                featured_image:
                    this.validImageURL(
                        this.form.featured_image
                    ),

                category_id:
                    this.form.category_id ||
                    null,

                author_name:
                    this.form.author_name.trim() ||
                    'Cyberind.id',

                status:
                    this.form.status,

                seo_title:
                    this.form.seo_title.trim() ||
                    null,

                seo_description:
                    this.form.seo_description.trim() ||
                    null,

                published_at:
                    publishedAt,

                updated_at:
                    new Date().toISOString()

            };


            let result;


            if (
                this.editing &&
                this.form.id
            ) {

                result =
                    await supabaseClient
                        .from('articles')
                        .update(
                            payload
                        )
                        .eq(
                            'id',
                            this.form.id
                        )
                        .select()
                        .single();

            } else {

                result =
                    await supabaseClient
                        .from('articles')
                        .insert(
                            payload
                        )
                        .select()
                        .single();

            }


            if (result.error) {

                this.saving =
                    false;

                this.notify(
                    'Gagal menyimpan: ' +
                    result.error.message,
                    'error'
                );

                return;

            }


            const article =
                result.data;


            await this.saveTags(
                article.id
            );


            this.form.id =
                article.id;

            this.form.published_at =
                article.published_at;

            this.form.created_at =
                article.created_at;

            this.form.updated_at =
                article.updated_at;

            this.form.slug =
                article.slug;


            this.editing =
                true;


            await this.loadArticles();


            this.saving =
                false;


            this.notify(
                'Artikel berhasil disimpan.'
            );

        },


        validImageURL(value) {

            if (!value) {
                return null;
            }

            try {

                const url =
                    new URL(value);

                if (
                    url.protocol !==
                    'https:'
                ) {

                    return null;

                }

                return url.href;

            } catch {

                return null;

            }

        },


        /* ================= TAGS ================= */

        async saveTags(articleId) {

            if (!articleId) {
                return;
            }


            await supabaseClient
                .from('article_tags')
                .delete()
                .eq(
                    'article_id',
                    articleId
                );


            const raw =
                this.form.tags || '';


            const names =
                raw
                    .split(',')
                    .map(
                        x => x.trim()
                    )
                    .filter(Boolean);


            const unique =
                [...new Set(
                    names.map(
                        x => x.toLowerCase()
                    )
                )];


            for (
                const lowerName
                of unique
            ) {

                const original =
                    names.find(
                        x =>
                            x.toLowerCase() ===
                            lowerName
                    );


                const slug =
                    slugify(
                        original
                    );


                let {
                    data: tag
                } =
                    await supabaseClient
                        .from('tags')
                        .select(
                            'id'
                        )
                        .eq(
                            'slug',
                            slug
                        )
                        .maybeSingle();


                if (!tag) {

                    const result =
                        await supabaseClient
                            .from('tags')
                            .insert({

                                name:
                                    original,

                                slug

                            })
                            .select()
                            .single();


                    tag =
                        result.data;

                }


                if (tag) {

                    await supabaseClient
                        .from('article_tags')
                        .insert({

                            article_id:
                                articleId,

                            tag_id:
                                tag.id

                        });

                }

            }

        },


        /* ================= DELETE ================= */

        async deleteArticle(article) {

            const confirmed =
                confirm(
                    `Hapus artikel "${article.title}"?\n\nTindakan ini tidak dapat dibatalkan.`
                );


            if (!confirmed) {
                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from('articles')
                    .delete()
                    .eq(
                        'id',
                        article.id
                    );


            if (error) {

                this.notify(
                    error.message,
                    'error'
                );

                return;

            }


            this.articles =
                this.articles.filter(
                    x =>
                        x.id !==
                        article.id
                );


            this.notify(
                'Artikel berhasil dihapus.'
            );

        },


        /* ================= UTIL ================= */

        formatDate(value) {

            if (!value) {
                return '-';
            }

            try {

                return new Intl.DateTimeFormat(
                    'id-ID',
                    {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric'
                    }
                ).format(
                    new Date(value)
                );

            } catch {

                return '-';

            }

        },


        notify(
            message,
            type = 'success'
        ) {

            this.toast = {

                show: true,

                message,

                type

            };


            setTimeout(
                () => {

                    this.toast.show =
                        false;

                },
                3500
            );

        }

    };

}

</script>
