<!DOCTYPE html>
<html lang="id" x-data="cmsApp()" :class="{ 'dark': dark }">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cyberind CMS — Admin</title>
<meta name="description" content="Cyberind.id Content Management System">
<link rel="icon" href="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class'};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
[x-cloak]{display:none!important}
:root{--red:#ef4444;--bg:#f5f5f5;--card:#fff;--text:#171717;--border:#e5e5e5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text)}
.dark body{background:#090909;color:#f5f5f5}.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.06)}
.dark .glass{background:rgba(20,20,20,.86);border-color:rgba(255,255,255,.08)}
.sidebar{width:260px;transition:.25s ease}.main{margin-left:260px}
@media(max-width:900px){.sidebar{transform:translateX(-100%);position:fixed;z-index:100;height:100vh}.sidebar.open{transform:translateX(0)}.main{margin-left:0}}
.editor{min-height:430px;outline:none;line-height:1.8}.editor:empty:before{content:attr(data-placeholder);color:#a3a3a3;pointer-events:none}
.editor h2{font-size:1.8rem;font-weight:700;margin:1.5rem 0 .7rem}.editor h3{font-size:1.45rem;font-weight:700;margin:1.3rem 0 .6rem}.editor h4{font-size:1.2rem;font-weight:700;margin:1.1rem 0 .5rem}.editor p{margin:.8rem 0}
.editor ul{list-style:disc;padding-left:1.8rem}.editor ol{list-style:decimal;padding-left:1.8rem}.editor blockquote{border-left:4px solid var(--red);padding:.7rem 1rem;margin:1rem 0;background:rgba(239,68,68,.06);font-style:italic}
.editor pre{background:#111;color:#fff;padding:1rem;border-radius:10px;overflow-x:auto}.editor img{max-width:100%;height:auto;border-radius:12px;margin:1rem 0}.editor iframe{width:100%;min-height:350px;border:0;border-radius:12px;margin:1rem 0}.editor a{color:#ef4444;text-decoration:underline}
.toolbar{display:flex;flex-wrap:wrap;gap:5px}.tool-btn{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e5e5e5;background:#fff;transition:.15s}.tool-btn:hover{background:#f5f5f5}
.dark .tool-btn{background:#171717;border-color:#333;color:#eee}.dark .tool-btn:hover{background:#262626}.tool-separator{width:1px;height:28px;background:#ddd;margin:4px}.dark .tool-separator{background:#333}
.modal-bg{background:rgba(0,0,0,.68);backdrop-filter:blur(5px)}.scrollbar::-webkit-scrollbar{width:6px}.scrollbar::-webkit-scrollbar-thumb{background:#525252;border-radius:20px}
.prose-content{line-height:1.85}.prose-content h2{font-size:1.8rem;font-weight:700;margin-top:2rem}.prose-content h3{font-size:1.45rem;font-weight:700;margin-top:1.5rem}.prose-content h4{font-size:1.2rem;font-weight:700;margin-top:1.2rem}.prose-content p{margin:1rem 0}.prose-content ul{list-style:disc;padding-left:2rem}.prose-content ol{list-style:decimal;padding-left:2rem}.prose-content blockquote{border-left:4px solid #ef4444;padding:1rem;background:rgba(239,68,68,.05);font-style:italic}.prose-content img{max-width:100%;border-radius:12px}.prose-content iframe{width:100%;min-height:400px;border:0;border-radius:12px}.prose-content pre{background:#111;color:#fff;padding:1rem;border-radius:10px;overflow-x:auto}
.toast{animation:toastIn .25s ease}@keyframes toastIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>
</head>
<body>

<div x-show="loading" x-cloak class="fixed inset-0 z-[999] flex items-center justify-center bg-black/70">
  <div class="text-center text-white"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-red-500 mb-4"></i><p>Memuat Cyberind CMS...</p></div>
</div>

<template x-if="!authenticated">
<div class="min-h-screen flex items-center justify-center px-5">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png" class="w-20 h-20 mx-auto mb-5 object-contain">
      <h1 class="text-3xl font-bold">Cyberind <span class="text-red-500">CMS</span></h1>
      <p class="text-neutral-500 mt-2">Content Management System</p>
    </div>
    <div class="glass rounded-2xl p-7 shadow-xl">
      <h2 class="text-xl font-bold mb-6">Login Administrator</h2>
      <form @submit.prevent="login">
        <label class="block text-sm font-medium mb-2">Email</label>
        <input x-model="loginForm.email" type="email" required autocomplete="username" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 outline-none focus:ring-2 focus:ring-red-500 mb-5" placeholder="admin@example.com">
        <label class="block text-sm font-medium mb-2">Password</label>
        <div class="relative">
          <input x-model="loginForm.password" :type="showPassword?'text':'password'" required autocomplete="current-password" class="w-full px-4 py-3 pr-12 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 outline-none focus:ring-2 focus:ring-red-500" placeholder="••••••••">
          <button type="button" @click="showPassword=!showPassword" class="absolute right-4 top-3 text-neutral-500"><i :class="showPassword?'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i></button>
        </div>
        <div x-show="loginError" x-cloak class="mt-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 text-sm" x-text="loginError"></div>
        <button type="submit" :disabled="loggingIn" class="w-full mt-6 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold disabled:opacity-50">
          <i :class="loggingIn?'fa-solid fa-circle-notch fa-spin':'fa-solid fa-right-to-bracket'" class="mr-2"></i>
          <span x-text="loggingIn?'Memproses...':'Masuk CMS'"></span>
        </button>
      </form>
      <div class="text-center mt-6 text-xs text-neutral-500">Cyberind.id · Independent Cyber Team</div>
    </div>
  </div>
</div>
</template>

<template x-if="authenticated">
<div>
<aside class="sidebar fixed top-0 left-0 bottom-0 bg-white dark:bg-neutral-950 border-r dark:border-neutral-800 flex flex-col" :class="{'open':mobileMenu}">
  <div class="p-6 border-b dark:border-neutral-800">
    <div class="flex items-center gap-3">
      <img src="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png" class="w-11 h-11 object-contain">
      <div><div class="font-bold">Cyberind <span class="text-red-500">CMS</span></div><div class="text-xs text-neutral-500">Admin Panel</div></div>
    </div>
  </div>
  <nav class="flex-1 p-4 overflow-y-auto scrollbar">
    <button @click="goPage('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1" :class="page==='dashboard'?'bg-red-500 text-white':'hover:bg-neutral-100 dark:hover:bg-neutral-900'"><i class="fa-solid fa-chart-line w-5"></i>Dashboard</button>
    <button @click="goPage('articles')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1" :class="page==='articles'?'bg-red-500 text-white':'hover:bg-neutral-100 dark:hover:bg-neutral-900'"><i class="fa-solid fa-newspaper w-5"></i>Artikel</button>
    <button @click="newArticle();mobileMenu=false" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 hover:bg-neutral-100 dark:hover:bg-neutral-900"><i class="fa-solid fa-pen-to-square w-5"></i>Tulis Artikel</button>
    <div class="mt-6 mb-2 px-4 text-xs uppercase tracking-wider text-neutral-400">Website</div>
    <a href="/blog/" target="_blank" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 hover:bg-neutral-100 dark:hover:bg-neutral-900"><i class="fa-solid fa-globe w-5"></i>Blog<i class="fa-solid fa-arrow-up-right-from-square text-xs ml-auto"></i></a>
    <a href="/" target="_blank" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-900"><i class="fa-solid fa-house w-5"></i>Homepage<i class="fa-solid fa-arrow-up-right-from-square text-xs ml-auto"></i></a>
  </nav>
  <div class="p-4 border-t dark:border-neutral-800">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-9 h-9 rounded-full bg-red-500 text-white flex items-center justify-center"><i class="fa-solid fa-user-shield"></i></div>
      <div class="min-w-0"><div class="font-semibold text-sm truncate" x-text="currentUser?.email||'Administrator'"></div><div class="text-xs text-neutral-500">Administrator</div></div>
    </div>
    <button @click="logout" class="w-full py-2.5 rounded-xl border dark:border-neutral-700 hover:bg-red-500 hover:text-white hover:border-red-500"><i class="fa-solid fa-right-from-bracket mr-2"></i>Logout</button>
  </div>
</aside>

<main class="main min-h-screen">
<header class="sticky top-0 z-40 glass border-b dark:border-neutral-800">
  <div class="px-5 md:px-8 py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <button @click="mobileMenu=!mobileMenu" class="md:hidden w-10 h-10 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800"><i class="fa-solid fa-bars"></i></button>
      <div><h1 class="font-bold text-lg" x-text="pageTitle"></h1><p class="text-xs text-neutral-500 hidden sm:block">Kelola konten Cyberind.id</p></div>
    </div>
    <div class="flex items-center gap-2">
      <button @click="dark=!dark;localStorage.setItem('cyberind-dark',dark)" class="w-10 h-10 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800"><i :class="dark?'fa-solid fa-sun':'fa-solid fa-moon'"></i></button>
      <a href="/blog/" target="_blank" class="hidden sm:flex w-10 h-10 rounded-xl items-center justify-center hover:bg-neutral-100 dark:hover:bg-neutral-800"><i class="fa-solid fa-globe"></i></a>
    </div>
  </div>
</header>

<div class="p-5 md:p-8">

<!-- DASHBOARD -->
<div x-show="page==='dashboard'" x-cloak>
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-7">
    <div><h2 class="text-2xl font-bold">Dashboard</h2><p class="text-neutral-500 mt-1">Selamat datang kembali di Cyberind CMS.</p></div>
    <button @click="newArticle()" class="px-5 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold"><i class="fa-solid fa-plus mr-2"></i>Artikel Baru</button>
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
    <div class="glass rounded-2xl p-5"><div class="flex justify-between"><span class="text-neutral-500">Total Artikel</span><i class="fa-solid fa-newspaper text-red-500"></i></div><div class="text-3xl font-bold mt-3" x-text="articles.length"></div></div>
    <div class="glass rounded-2xl p-5"><div class="flex justify-between"><span class="text-neutral-500">Published</span><i class="fa-solid fa-circle-check text-green-500"></i></div><div class="text-3xl font-bold mt-3" x-text="publishedCount"></div></div>
    <div class="glass rounded-2xl p-5"><div class="flex justify-between"><span class="text-neutral-500">Draft</span><i class="fa-solid fa-file text-yellow-500"></i></div><div class="text-3xl font-bold mt-3" x-text="draftCount"></div></div>
    <div class="glass rounded-2xl p-5"><div class="flex justify-between"><span class="text-neutral-500">Views</span><i class="fa-solid fa-eye text-blue-500"></i></div><div class="text-3xl font-bold mt-3" x-text="totalViews"></div></div>
  </div>
  <div class="glass rounded-2xl overflow-hidden">
    <div class="p-5 border-b dark:border-neutral-800 flex items-center justify-between"><h3 class="font-bold">Artikel Terbaru</h3><button @click="goPage('articles')" class="text-sm text-red-500">Lihat Semua</button></div>
    <div class="divide-y dark:divide-neutral-800">
      <template x-for="article in articles.slice(0,5)" :key="article.id">
        <div class="p-5 flex items-center gap-4">
          <div class="w-16 h-12 rounded-lg bg-neutral-100 dark:bg-neutral-800 overflow-hidden shrink-0">
            <template x-if="article.featured_image"><img :src="article.featured_image" class="w-full h-full object-cover"></template>
            <template x-if="!article.featured_image"><div class="w-full h-full flex items-center justify-center"><i class="fa-solid fa-newspaper text-neutral-400"></i></div></template>
          </div>
          <div class="min-w-0 flex-1"><div class="font-semibold truncate" x-text="article.title"></div><div class="text-xs text-neutral-500 mt-1"><span x-text="formatDate(article.created_at)"></span> · <span x-text="article.author_name"></span></div></div>
          <span class="hidden sm:inline-flex items-center gap-2 text-xs px-3 py-1.5 rounded-full" :class="article.status==='published'?'bg-green-500/10 text-green-500':'bg-yellow-500/10 text-yellow-600'"><span class="status-dot" :class="article.status==='published'?'bg-green-500':'bg-yellow-500'"></span><span x-text="article.status==='published'?'Published':'Draft'"></span></span>
        </div>
      </template>
      <div x-show="!articles.length" class="p-8 text-center text-neutral-500">Belum ada artikel.</div>
    </div>
  </div>
</div>

<!-- ARTICLES -->
<div x-show="page==='articles'" x-cloak>
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-7">
    <div><h2 class="text-2xl font-bold">Artikel</h2><p class="text-neutral-500 mt-1">Kelola semua artikel Cyberind Journal.</p></div>
    <button @click="newArticle()" class="px-5 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold"><i class="fa-solid fa-plus mr-2"></i>Artikel Baru</button>
  </div>
  <div class="glass rounded-2xl p-4 mb-5 flex flex-col md:flex-row gap-3">
    <div class="relative flex-1"><i class="fa-solid fa-search absolute left-4 top-3.5 text-neutral-400"></i><input x-model="search" class="w-full pl-11 pr-4 py-3 rounded-xl border dark:border-neutral-700 bg-transparent" placeholder="Cari judul, slug, excerpt..."></div>
    <select x-model="statusFilter" class="px-4 py-3 rounded-xl border dark:border-neutral-700 bg-transparent"><option value="">Semua status</option><option value="published">Published</option><option value="draft">Draft</option></select>
    <select x-model="categoryFilter" class="px-4 py-3 rounded-xl border dark:border-neutral-700 bg-transparent"><option value="">Semua kategori</option><template x-for="c in categories" :key="c.id"><option :value="c.id" x-text="c.name"></option></template></select>
  </div>
  <div class="glass rounded-2xl overflow-hidden">
    <div class="hidden md:grid grid-cols-[1fr_150px_120px_140px] gap-4 px-5 py-4 border-b dark:border-neutral-800 text-xs uppercase tracking-wider text-neutral-400"><div>Artikel</div><div>Kategori</div><div>Status</div><div class="text-right">Aksi</div></div>
    <template x-for="article in filteredArticles" :key="article.id">
      <div class="p-5 border-b dark:border-neutral-800 last:border-0 flex flex-col md:grid md:grid-cols-[1fr_150px_120px_140px] gap-3 md:items-center">
        <div class="min-w-0 flex gap-4">
          <div class="w-20 h-14 rounded-lg bg-neutral-100 dark:bg-neutral-800 overflow-hidden shrink-0">
            <template x-if="article.featured_image"><img :src="article.featured_image" class="w-full h-full object-cover"></template>
            <template x-if="!article.featured_image"><div class="w-full h-full flex items-center justify-center"><i class="fa-solid fa-image text-neutral-400"></i></div></template>
          </div>
          <div class="min-w-0"><div class="font-semibold truncate" x-text="article.title"></div><div class="text-xs text-neutral-500 mt-1 truncate" x-text="article.slug"></div><div class="text-xs text-neutral-500 mt-1"><span x-text="formatDate(article.created_at)"></span> · <span x-text="article.views||0"></span> views</div></div>
        </div>
        <div class="text-sm" x-text="article.categories?.name || 'Tanpa kategori'"></div>
        <div><span class="inline-flex items-center gap-2 text-xs px-3 py-1.5 rounded-full" :class="article.status==='published'?'bg-green-500/10 text-green-500':'bg-yellow-500/10 text-yellow-600'" x-text="article.status==='published'?'Published':'Draft'"></span></div>
        <div class="flex justify-end gap-2">
          <button @click="previewArticle(article)" class="w-9 h-9 rounded-lg border dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800" title="Preview"><i class="fa-solid fa-eye"></i></button>
          <button @click="editArticle(article)" class="w-9 h-9 rounded-lg border dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800" title="Edit"><i class="fa-solid fa-pen"></i></button>
          <button @click="deleteArticle(article)" class="w-9 h-9 rounded-lg border border-red-500/30 text-red-500 hover:bg-red-500 hover:text-white" title="Hapus"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    </template>
    <div x-show="!filteredArticles.length" class="p-10 text-center text-neutral-500"><i class="fa-solid fa-inbox text-3xl mb-3"></i><p>Tidak ada artikel yang cocok.</p></div>
  </div>
</div>

<!-- EDITOR: persistent DOM with x-show, NOT x-if -->
<div x-show="page==='editor'" x-cloak>
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div><button @click="goPage('articles')" class="text-sm text-neutral-500 hover:text-red-500 mb-2"><i class="fa-solid fa-arrow-left mr-2"></i>Kembali ke Artikel</button><h2 class="text-2xl font-bold" x-text="editing?'Edit Artikel':'Tulis Artikel'"></h2></div>
    <div class="flex flex-wrap gap-2">
      <button @click="previewCurrent()" class="px-4 py-2.5 rounded-xl border dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800"><i class="fa-solid fa-eye mr-2"></i>Preview</button>
      <button @click="saveArticle()" :disabled="saving" class="px-5 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold disabled:opacity-50"><i :class="saving?'fa-solid fa-circle-notch fa-spin':'fa-solid fa-floppy-disk'" class="mr-2"></i><span x-text="saving?'Menyimpan...':'Simpan Artikel'"></span></button>
    </div>
  </div>

  <div class="grid xl:grid-cols-[1fr_340px] gap-6">
    <div class="space-y-6">
      <div class="glass rounded-2xl p-5 md:p-7">
        <label class="block text-sm font-semibold mb-2">Judul</label>
        <input x-model="form.title" @input="autoSlug()" class="w-full text-2xl md:text-3xl font-bold px-0 py-3 border-0 border-b dark:border-neutral-700 bg-transparent outline-none" placeholder="Tulis judul artikel...">
        <div class="mt-5"><label class="block text-sm font-semibold mb-2">Slug</label><div class="flex"><span class="px-3 py-3 rounded-l-xl bg-neutral-100 dark:bg-neutral-800 text-xs text-neutral-500 flex items-center">/blog/article.html?slug=</span><input x-model="form.slug" class="flex-1 px-3 py-3 rounded-r-xl border dark:border-neutral-700 bg-transparent text-sm" placeholder="slug-artikel"></div></div>
        <div class="mt-5"><label class="block text-sm font-semibold mb-2">Excerpt / Ringkasan</label><textarea x-model="form.excerpt" rows="3" class="w-full px-4 py-3 rounded-xl border dark:border-neutral-700 bg-transparent outline-none focus:ring-2 focus:ring-red-500" placeholder="Ringkasan singkat artikel..."></textarea></div>
      </div>

      <div class="glass rounded-2xl overflow-hidden">
        <div class="p-4 border-b dark:border-neutral-800 flex flex-wrap items-center justify-between gap-3">
          <div><span class="font-bold">Konten Artikel</span><span class="text-xs text-neutral-500 ml-3" x-text="wordCount+' kata'"></span></div>
          <button @click="toggleSource()" class="px-3 py-2 rounded-lg border dark:border-neutral-700 text-sm"><i :class="sourceMode?'fa-solid fa-pen':'fa-solid fa-code'" class="mr-2"></i><span x-text="sourceMode?'Visual Editor':'HTML Source'"></span></button>
        </div>
        <div x-show="!sourceMode" class="p-3 border-b dark:border-neutral-800">
          <div class="toolbar">
            <button type="button" @mousedown.prevent @click="exec('undo')" class="tool-btn" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
            <button type="button" @mousedown.prevent @click="exec('redo')" class="tool-btn" title="Redo"><i class="fa-solid fa-rotate-right"></i></button><span class="tool-separator"></span>
            <select @change="formatBlock($event.target.value)" class="h-9 rounded-lg border dark:border-neutral-700 bg-white dark:bg-neutral-900 px-2 text-sm"><option value="">Format</option><option value="p">Paragraph</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="h4">Heading 4</option><option value="pre">Code</option></select>
            <button type="button" @mousedown.prevent @click="exec('bold')" class="tool-btn"><i class="fa-solid fa-bold"></i></button>
            <button type="button" @mousedown.prevent @click="exec('italic')" class="tool-btn"><i class="fa-solid fa-italic"></i></button>
            <button type="button" @mousedown.prevent @click="exec('underline')" class="tool-btn"><i class="fa-solid fa-underline"></i></button>
            <button type="button" @mousedown.prevent @click="exec('strikeThrough')" class="tool-btn"><i class="fa-solid fa-strikethrough"></i></button><span class="tool-separator"></span>
            <button type="button" @mousedown.prevent @click="exec('insertUnorderedList')" class="tool-btn"><i class="fa-solid fa-list-ul"></i></button>
            <button type="button" @mousedown.prevent @click="exec('insertOrderedList')" class="tool-btn"><i class="fa-solid fa-list-ol"></i></button>
            <button type="button" @mousedown.prevent @click="exec('formatBlock','blockquote')" class="tool-btn"><i class="fa-solid fa-quote-left"></i></button>
            <button type="button" @mousedown.prevent @click="exec('justifyLeft')" class="tool-btn"><i class="fa-solid fa-align-left"></i></button>
            <button type="button" @mousedown.prevent @click="exec('justifyCenter')" class="tool-btn"><i class="fa-solid fa-align-center"></i></button>

<script>
const SUPABASE_URL='https://lwolwingtzqdfsqoopra.supabase.co';
const SUPABASE_KEY='sb_publishable_w8vzcXhO42RrHSopV8Gi9A_ecg6m_0A';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const STORAGE_BUCKET='article-images';

const ALLOWED_IFRAME_HOSTS=[
  'www.youtube.com','youtube.com','www.youtube-nocookie.com','youtube-nocookie.com',
  'player.vimeo.com','open.spotify.com','w.soundcloud.com',
  'www.google.com','google.com','maps.google.com'
];

function slugify(value=''){
  return value.toString().normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,180);
}
function escapeHTML(value=''){
  return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function safeURL(value,allowedProtocols=['http:','https:']){
  try{const u=new URL(value,location.href);return allowedProtocols.includes(u.protocol)?u.href:''}catch{return ''}
}
function sanitizeHTML(html=''){
  if(!window.DOMPurify)return html;
  let clean=DOMPurify.sanitize(html,{
    USE_PROFILES:{html:true},
    ADD_TAGS:['iframe'],
    ADD_ATTR:['allow','allowfullscreen','frameborder','loading','referrerpolicy','title','target','rel','controls','width','height']
  });
  const doc=new DOMParser().parseFromString(clean,'text/html');

  doc.querySelectorAll('iframe').forEach(frame=>{
    try{
      const u=new URL(frame.getAttribute('src')||'',location.href);
      if(!ALLOWED_IFRAME_HOSTS.includes(u.hostname.toLowerCase())) frame.remove();
      else{
        frame.setAttribute('loading','lazy');
        frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
        frame.setAttribute('allowfullscreen','');
      }
    }catch{frame.remove()}
  });
  doc.querySelectorAll('a').forEach(a=>{
    const href=safeURL(a.getAttribute('href')||'');
    if(!href)a.removeAttribute('href');
    else{
      a.setAttribute('href',href);
      if(a.getAttribute('target')==='_blank')a.setAttribute('rel','noopener noreferrer');
    }
  });
  doc.querySelectorAll('img').forEach(img=>{
    const src=safeURL(img.getAttribute('src')||'');
    if(!src)img.remove();
    else{img.setAttribute('src',src);img.setAttribute('loading','lazy');img.setAttribute('decoding','async')}
  });
  return doc.body.innerHTML;
}
function wordCountFromHTML(html=''){
  const text=new DOMParser().parseFromString(html,'text/html').body.textContent||'';
  return text.trim()?text.trim().split(/\s+/).length:0;
}
function iframeFor(type,value){
  const raw=value.trim();
  if(raw.startsWith('<iframe')){
    const doc=new DOMParser().parseFromString(raw,'text/html');
    const iframe=doc.querySelector('iframe');
    if(!iframe)return '';
    const src=iframe.getAttribute('src')||'';
    try{const u=new URL(src);if(!ALLOWED_IFRAME_HOSTS.includes(u.hostname.toLowerCase()))return ''}catch{return ''}
    return sanitizeHTML(iframe.outerHTML);
  }
  let u;
  try{u=new URL(raw)}catch{return ''}
  let src='';
  if(type==='youtube'){
    let id='';
    if(u.hostname.includes('youtu.be'))id=u.pathname.slice(1).split('/')[0];
    else id=u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop();
    if(!id)return '';
    src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id);
  }else if(type==='vimeo'){
    const id=u.pathname.split('/').filter(Boolean).pop();if(!id)return '';src='https://player.vimeo.com/video/'+encodeURIComponent(id);
  }else if(type==='spotify'){
    if(!u.hostname.endsWith('spotify.com'))return '';src=u.href.replace('/track/','/embed/track/').replace('/album/','/embed/album/').replace('/playlist/','/embed/playlist/').replace('/episode/','/embed/episode/');
  }else if(type==='soundcloud'){
    if(!u.hostname.endsWith('soundcloud.com'))return '';src='https://w.soundcloud.com/player/?url='+encodeURIComponent(u.href);
  }else if(type==='maps'){
    if(!['google.com','www.google.com','maps.google.com'].includes(u.hostname))return '';src=u.href;
  }else return '';
  return sanitizeHTML(`<iframe src="${escapeHTML(src)}" title="Embedded media" loading="lazy" allowfullscreen></iframe>`);
}

function cmsApp(){
return{
  supabase:supabaseClient,
  loading:true,authenticated:false,currentUser:null,
  dark:localStorage.getItem('cyberind-dark')==='true',
  mobileMenu:false,page:'dashboard',
  loginForm:{email:'',password:''},loginError:'',loggingIn:false,showPassword:false,
  articles:[],categories:[],search:'',statusFilter:'',categoryFilter:'',
  editing:false,saving:false,uploadingImage:false,uploadingEditorImage:false,
  sourceMode:false,selectedRange:null,
  categoryModal:false,newCategory:{name:'',slug:''},
  linkModal:false,linkForm:{url:'',text:'',newTab:true},
  imageModal:false,imageForm:{url:'',alt:''},
  embedModal:false,embedForm:{type:'youtube',value:''},
  previewModal:false,previewData:{title:'',excerpt:'',content:'',image:'',category:'',meta:''},
  toast:{show:false,message:'',type:'success'},toastTimer:null,
  form:this.emptyForm(),

  init(){
    this.dark=localStorage.getItem('cyberind-dark')==='true';
    this.$watch('form.title',()=>this.autoSlug());
    this.setupAuth();
  },

  emptyForm(){
    return {id:null,title:'',slug:'',excerpt:'',content:'',featured_image:'',category_id:'',
      author_name:'Cyberind.id',status:'draft',seo_title:'',seo_description:'',
      views:0,published_at:null,created_at:null,updated_at:null,tags:''};
  },

  get pageTitle(){
    return {dashboard:'Dashboard',articles:'Artikel',editor:this.editing?'Edit Artikel':'Tulis Artikel'}[this.page]||'Cyberind CMS';
  },
  get publishedCount(){return this.articles.filter(a=>a.status==='published').length},
  get draftCount(){return this.articles.filter(a=>a.status!=='published').length},
  get totalViews(){return this.articles.reduce((n,a)=>n+Number(a.views||0),0)},
  get filteredArticles(){
    const q=this.search.trim().toLowerCase();
    return this.articles.filter(a=>{
      const text=[a.title,a.slug,a.excerpt,a.author_name].join(' ').toLowerCase();
      return (!q||text.includes(q))&&(!this.statusFilter||a.status===this.statusFilter)&&(!this.categoryFilter||a.category_id===this.categoryFilter);
    });
  },
  get wordCount(){
    return wordCountFromHTML(this.sourceMode?this.form.content:(this.$refs.editor?.innerHTML||this.form.content||''));
  },

  async setupAuth(){
    try{
      const {data:{session}}=await this.supabase.auth.getSession();
      if(session)await this.acceptSession(session);
      this.supabase.auth.onAuthStateChange(async(_event,session)=>{
        if(session)await this.acceptSession(session);
        else{this.authenticated=false;this.currentUser=null;this.loading=false}
      });
    }catch(e){console.error(e);this.loading=false}
  },

  async acceptSession(session){
    this.currentUser=session.user;
    const {data,error}=await this.supabase.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();
    if(error||!data){
      await this.supabase.auth.signOut();
      this.loginError='Akun berhasil login, tetapi tidak terdaftar sebagai administrator.';
      this.authenticated=false;
      this.loading=false;
      return;
    }
    this.authenticated=true;
    this.loading=false;
    await this.loadAll();
  },

  async login(){
    this.loggingIn=true;this.loginError='';
    const {data,error}=await this.supabase.auth.signInWithPassword(this.loginForm);
    if(error){this.loginError=error.message;this.loggingIn=false;return}
    if(data.session)await this.acceptSession(data.session);
    this.loggingIn=false;
  },

  async logout(){await this.supabase.auth.signOut();this.page='dashboard'},

  async loadAll(){await Promise.all([this.loadArticles(),this.loadCategories()])},

  async loadArticles(){
    const {data,error}=await this.supabase.from('articles').select(`
      id,title,slug,excerpt,content,featured_image,category_id,author_name,status,
      seo_title,seo_description,views,published_at,created_at,updated_at,
      categories(id,name,slug)
    `).order('created_at',{ascending:false});
    if(error){this.notify(error.message,'error');return}
    this.articles=data||[];
  },

    if(error){console.error(error);return}
    this.categories=data||[];
  },

  goPage(page){

    this.page=page;this.mobileMenu=false;
  },

  newArticle(){
    this.editing=false;
    this.form=this.emptyForm();
    this.sourceMode=false;
    this.selectedRange=null;
    this.page='editor';
    this.$nextTick(()=>this.mountEditorContent(true));
  },

    this.editing=true;
    this.form={
      id:article.id,title:article.title||'',slug:article.slug||'',excerpt:article.excerpt||'',
      content:article.content||'',featured_image:article.featured_image||'',category_id:article.category_id||'',
      author_name:article.author_name||'Cyberind.id',status:article.status||'draft',
      seo_title:article.seo_title||'',seo_description:article.seo_description||'',views:Number(article.views||0),
      published_at:article.published_at||null,created_at:article.created_at||null,updated_at:article.updated_at||null,tags:''
    };

    this.$nextTick(()=>{
      this.mountEditorContent();
      this.loadArticleTags(article.id);

    const {data,error}=await this.supabase.from('article_tags').select('tag_id,tags(id,name,slug)').eq('article_id',articleId);
    if(error){console.warn(error);return}
    this.form.tags=(data||[]).map(x=>x.tags?.name).filter(Boolean).join(', ');
  },

  mountEditorContent(clear=false){
    const editor=this.$refs.editor;
    if(!editor){setTimeout(()=>this.mountEditorContent(clear),50);return}
    const content=clear?'':sanitizeHTML(this.form.content||'');
    editor.innerHTML=content;
    if(!clear)this.form.content=content;
  },

  syncEditor(){
    if(this.sourceMode)return;
    const editor=this.$refs.editor;
    if(editor)this.form.content=sanitizeHTML(editor.innerHTML||'');
  },

  toggleSource(){
    if(!this.sourceMode){
      this.syncEditor();
      this.sourceMode=true;
      return;
    }
    this.form.content=sanitizeHTML(this.form.content||'');
    this.sourceMode=false;
    this.$nextTick(()=>this.mountEditorContent());
  },

  captureSelection(){
    const editor=this.$refs.editor;
    const sel=window.getSelection();
    if(!editor||!sel||!sel.rangeCount)return;
    const range=sel.getRangeAt(0);
    if(editor.contains(range.commonAncestorContainer))this.selectedRange=range.cloneRange();
  },

  restoreSelection(){
    const editor=this.$refs.editor;
    if(!editor)return;
    editor.focus();
    if(this.selectedRange){
      const sel=window.getSelection();sel.removeAllRanges();sel.addRange(this.selectedRange);
    }
  },

  exec(command,value=null){
    const editor=this.$refs.editor;if(!editor)return;
    this.restoreSelection();
    document.execCommand(command,false,value);
    this.syncEditor();
    this.captureSelection();
  },

  formatBlock(tag){
    if(!tag)return;
    this.exec('formatBlock',tag);
  },

  autoSlug(){
    if(!this.editing||!this.form.slug)this.form.slug=slugify(this.form.title);
  },

  openLinkModal(){
    this.captureSelection();
    this.linkForm={url:'',text:this.selectedText(),newTab:true};
    this.linkModal=true;
  },

  selectedText(){
    if(this.selectedRange)return this.selectedRange.toString();
    const s=window.getSelection();return s?.toString()||'';
  },

  insertLink(){
    const url=safeURL(this.linkForm.url);
    if(!url){this.notify('URL tidak valid. Gunakan http/https.','error');return}
    const editor=this.$refs.editor;if(!editor){this.linkModal=false;return}
    this.restoreSelection();
    const text=this.linkForm.text||this.selectedText()||url;
    const html=`<a href="${escapeHTML(url)}"${this.linkForm.newTab?' target="_blank" rel="noopener noreferrer"':''}>${escapeHTML(text)}</a>`;
    document.execCommand('insertHTML',false,html);
    this.syncEditor();this.linkModal=false;this.captureSelection();
  },

  openImageModal(){
    this.captureSelection();
    this.imageForm={url:'',alt:''};this.imageModal=true;
  },

  insertImage(){
    const url=safeURL(this.imageForm.url);
    if(!url){this.notify('URL gambar tidak valid.','error');return}
    this.restoreSelection();
    document.execCommand('insertHTML',false,`<img src="${escapeHTML(url)}" alt="${escapeHTML(this.imageForm.alt||'')}" loading="lazy">`);
    this.syncEditor();this.imageModal=false;this.captureSelection();
  },

  openEmbedModal(){this.captureSelection();this.embedForm={type:'youtube',value:''};this.embedModal=true},

  insertEmbed(){
    const html=iframeFor(this.embedForm.type,this.embedForm.value);
    if(!html){this.notify('Embed tidak valid atau sumber tidak diizinkan.','error');return}
    this.restoreSelection();document.execCommand('insertHTML',false,html);this.syncEditor();this.embedModal=false;this.captureSelection();
  },

  async handlePaste(event){
    const html=event.clipboardData?.getData('text/html');
    if(html){
      event.preventDefault();
      document.execCommand('insertHTML',false,sanitizeHTML(html));
      this.syncEditor();this.captureSelection();
    }
  },

  async uploadFeaturedImage(event){
    const file=event.target.files?.[0];if(!file)return;
    this.uploadingImage=true;
    try{
      const url=await this.uploadFile(file);
      this.form.featured_image=url;this.notify('Featured image berhasil diunggah.');
    }catch(e){this.notify(e.message,'error')}finally{this.uploadingImage=false;event.target.value=''}
  },

  async uploadEditorImage(event){
    const file=event.target.files?.[0];if(!file)return;
    this.uploadingEditorImage=true;
    try{
      const url=await this.uploadFile(file);
      this.imageForm.url=url;
      this.notify('Gambar berhasil diunggah. Klik Masukkan Gambar.');
    }catch(e){this.notify(e.message,'error')}finally{this.uploadingEditorImage=false;event.target.value=''}
  },

  async uploadFile(file){
    if(!file.type.startsWith('image/'))throw new Error('File harus berupa gambar.');
    if(file.size>8*1024*1024)throw new Error('Ukuran gambar maksimal 8 MB.');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=`articles/${crypto.randomUUID()}.${ext}`;
    const {error}=await this.supabase.storage.from(STORAGE_BUCKET).upload(path,file,{upsert:false,cacheControl:'3600',contentType:file.type});
    if(error)throw error;
    const {data}=this.supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return data.publicUrl;
  },

  async addCategory(){
    const name=this.newCategory.name.trim();const slug=slugify(this.newCategory.slug||name);
    if(!name||!slug){this.notify('Nama kategori wajib diisi.','error');return}
    const {data,error}=await this.supabase.from('categories').insert({name,slug}).select().single();
    if(error){this.notify(error.message,'error');return}
    this.categories.push(data);this.form.category_id=data.id;this.newCategory={name:'',slug:''};this.categoryModal=false;this.notify('Kategori ditambahkan.');
  },

  async saveArticle(){
    if(!this.form.title.trim()){this.notify('Judul artikel wajib diisi.','error');return}
    if(!this.form.slug.trim())this.form.slug=slugify(this.form.title);
    if(this.sourceMode)this.form.content=sanitizeHTML(this.form.content||'');
    else{
      const editor=this.$refs.editor;
      if(!editor){this.notify('Editor belum siap. Silakan coba lagi.','error');return}
      this.form.content=sanitizeHTML(editor.innerHTML||'');
    }
    if(!this.form.content.trim()){this.notify('Isi artikel belum diisi.','error');return}

    this.saving=true;
    try{
      const payload={
        title:this.form.title.trim(),slug:this.form.slug.trim(),excerpt:this.form.excerpt||'',
        content:this.form.content,featured_image:this.form.featured_image||null,category_id:this.form.category_id||null,
        author_name:this.form.author_name||'Cyberind.id',status:this.form.status,
        seo_title:this.form.seo_title||null,seo_description:this.form.seo_description||null,
        published_at:this.form.status==='published'?(this.form.published_at||new Date().toISOString()):null,
        updated_at:new Date().toISOString()
      };
      let article;
      if(this.form.id){
        const {data,error}=await this.supabase.from('articles').update(payload).eq('id',this.form.id).select().single();
        if(error)throw error;article=data;
      }else{
        const {data,error}=await this.supabase.from('articles').insert(payload).select().single();
        if(error)throw error;article=data;this.form.id=data.id;this.editing=true;
      }
      await this.saveTags(article.id,this.form.tags);
      await this.loadArticles();
      this.notify('Artikel berhasil disimpan.');
      this.form.created_at=article.created_at;this.form.updated_at=article.updated_at;this.form.published_at=article.published_at;
    }catch(e){console.error(e);this.notify(e.message||'Gagal menyimpan artikel.','error')}
    finally{this.saving=false}
  },

  async saveTags(articleId,value){
    const names=[...new Set((value||'').split(',').map(x=>x.trim()).filter(Boolean))];
    await this.supabase.from('article_tags').delete().eq('article_id',articleId);
    if(!names.length)return;
    for(const name of names){
      const slug=slugify(name);
      let {data}=await this.supabase.from('tags').select('id').eq('slug',slug).maybeSingle();
      if(!data){
        const res=await this.supabase.from('tags').insert({name,slug}).select('id').single();
        if(res.error)continue;data=res.data;
      }
      await this.supabase.from('article_tags').insert({article_id:articleId,tag_id:data.id});
    }
  },

  async deleteArticle(article){
    if(!confirm(`Hapus artikel "${article.title}"? Tindakan ini tidak dapat dibatalkan.`))return;
    const {error}=await this.supabase.from('articles').delete().eq('id',article.id);
    if(error){this.notify(error.message,'error');return}
    this.articles=this.articles.filter(a=>a.id!==article.id);this.notify('Artikel dihapus.');
  },

  previewCurrent(){
    if(this.sourceMode)this.form.content=sanitizeHTML(this.form.content||'');else this.syncEditor();
    const cat=this.categories.find(c=>c.id===this.form.category_id);
    this.previewData={
      title:this.form.title||'Tanpa judul',excerpt:this.form.excerpt||'',content:sanitizeHTML(this.form.content||''),
      image:this.form.featured_image||'',category:cat?.name||'',meta:`${this.form.author_name||'Cyberind.id'} · ${this.formatDate(new Date().toISOString())}`
    };
    this.previewModal=true;
  },

  previewArticle(article){
    this.previewData={
      title:article.title||'',excerpt:article.excerpt||'',content:sanitizeHTML(article.content||''),
      image:article.featured_image||'',category:article.categories?.name||'',
      meta:`${article.author_name||'Cyberind.id'} · ${this.formatDate(article.published_at||article.created_at)}`
    };
    this.previewModal=true;
  },

  formatDate(value){
    if(!value)return '-';
    try{return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}
    catch{return value}
  },

  notify(message,type='success'){
    clearTimeout(this.toastTimer);this.toast={show:true,message,type};
    this.toastTimer=setTimeout(()=>this.toast.show=false,3500);
  }
}}
</script>
</body>
</html>
