<!DOCTYPE html>
<html lang="id" x-data="cmsApp" :class="{ 'dark': dark }">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyberind CMS — Admin</title>
<meta name="description" content="Cyberind.id Content Management System">
<link rel="icon" href="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class'};
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
[x-cloak]{display:none!important}
:root{--red:#ef4444;--bg:#f5f5f5;--text:#171717}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text)}
.dark body{background:#090909;color:#f5f5f5}.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.06)}
.dark .glass{background:rgba(20,20,20,.86);border-color:rgba(255,255,255,.08)}
.sidebar{width:260px;transition:.25s}.main{margin-left:260px}
@media(max-width:900px){.sidebar{transform:translateX(-100%);position:fixed;z-index:100;height:100vh}.sidebar.open{transform:translateX(0)}.main{margin-left:0}}
.editor{min-height:430px;outline:none;line-height:1.8}.editor:empty:before{content:attr(data-placeholder);color:#a3a3a3;pointer-events:none}
.editor h2{font-size:1.8rem;font-weight:700;margin:1.5rem 0 .7rem}.editor h3{font-size:1.45rem;font-weight:700;margin:1.3rem 0 .6rem}.editor h4{font-size:1.2rem;font-weight:700;margin:1.1rem 0 .5rem}.editor p{margin:.8rem 0}.editor ul{list-style:disc;padding-left:1.8rem}.editor ol{list-style:decimal;padding-left:1.8rem}.editor blockquote{border-left:4px solid var(--red);padding:.7rem 1rem;margin:1rem 0;background:rgba(239,68,68,.06);font-style:italic}.editor pre{background:#111;color:#fff;padding:1rem;border-radius:10px;overflow:auto}.editor img{max-width:100%;height:auto;border-radius:12px;margin:1rem 0}.editor iframe{width:100%;min-height:350px;border:0;border-radius:12px;margin:1rem 0}.editor a{color:#ef4444;text-decoration:underline}.toolbar{display:flex;flex-wrap:wrap;gap:5px}.tool-btn{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e5e5e5;background:#fff}.dark .tool-btn{background:#171717;border-color:#333;color:#eee}.toast{animation:toast .25s ease}@keyframes toast{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}.modal-bg{background:rgba(0,0,0,.65);backdrop-filter:blur(5px)}.prose-content{line-height:1.85}.prose-content img,.prose-content iframe{max-width:100%;border-radius:12px}.prose-content iframe{width:100%;min-height:400px;border:0}.prose-content pre{background:#111;color:#fff;padding:1rem;border-radius:10px;overflow:auto}.scrollbar::-webkit-scrollbar{width:6px}.scrollbar::-webkit-scrollbar-thumb{background:#525252;border-radius:20px}
</style>
<script>
const SUPABASE_URL='https://lwolwingtzqdfsqoopra.supabase.co';
const SUPABASE_KEY='sb_publishable_w8vzcXhO42RrHSopV8Gi9A_ecg6m_0A';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const STORAGE_BUCKET='article-images';

function escapeHTML(v=''){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}
function slugify(v=''){return v.toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,120)}
function safeURL(value){try{const u=new URL(String(value).trim());if(!['http:','https:'].includes(u.protocol))return null;return u.href}catch{return null}}
function safeHttpsURL(value){try{const u=new URL(String(value).trim());return u.protocol==='https:'?u:null}catch{return null}}
function wordCountFromHTML(html=''){const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').trim().split(/\s+/).filter(Boolean).length}
const ALLOWED_IFRAME_HOSTS=['youtube.com','www.youtube.com','youtu.be','youtube-nocookie.com','www.youtube-nocookie.com','player.vimeo.com','vimeo.com','open.spotify.com','w.soundcloud.com','soundcloud.com','www.google.com','maps.google.com'];
function hostAllowed(host){host=host.toLowerCase();return ALLOWED_IFRAME_HOSTS.some(x=>host===x||host.endsWith('.'+x))}
function sanitizeHTML(html=''){
  let clean=DOMPurify.sanitize(String(html),{
    USE_PROFILES:{html:true},
    ADD_TAGS:['iframe'],
    ADD_ATTR:['target','rel','loading','allow','allowfullscreen','frameborder','referrerpolicy','class','width','height']
  });
  const box=document.createElement('div');box.innerHTML=clean;
  box.querySelectorAll('iframe').forEach(f=>{
    try{const u=new URL(f.getAttribute('src')||'',location.href);if(u.protocol!=='https:'||!hostAllowed(u.hostname))f.remove();else{f.setAttribute('src',u.href);f.setAttribute('loading','lazy');f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');f.setAttribute('allowfullscreen','');}}catch{f.remove()}
  });
  box.querySelectorAll('a').forEach(a=>{
    const href=safeURL(a.getAttribute('href')||'');if(!href)a.removeAttribute('href');else a.setAttribute('href',href);
    if(a.target==='_blank')a.rel='noopener noreferrer';
  });
  return box.innerHTML;
}
function youtubeEmbed(v){try{const u=new URL(v);let id=u.searchParams.get('v');if(u.hostname==='youtu.be')id=u.pathname.slice(1);if(!id&&u.pathname.includes('/embed/'))id=u.pathname.split('/embed/')[1].split('/')[0];return id&&/^[\w-]{6,20}$/.test(id)?`https://www.youtube-nocookie.com/embed/${id}`:null}catch{return null}}
function vimeoEmbed(v){try{const u=new URL(v);const m=u.pathname.match(/\/(?:video\/)?(\d+)/);return m?`https://player.vimeo.com/video/${m[1]}`:null}catch{return null}}
function spotifyEmbed(v){try{const u=new URL(v);if(!hostAllowed(u.hostname))return null;const m=u.pathname.match(/\/(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);return m?`https://open.spotify.com/embed/${m[1]}/${m[2]}`:null}catch{return null}}
function soundcloudEmbed(v){try{const u=new URL(v);return /soundcloud\.com$/i.test(u.hostname)||/\.soundcloud\.com$/i.test(u.hostname)?`https://w.soundcloud.com/player/api.html?url=${encodeURIComponent(u.href)}&color=%23ef4444&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&visual=false`:null}catch{return null}}
function mapsEmbed(v){try{const u=new URL(v);if(!hostAllowed(u.hostname))return null;return u.href.includes('/maps/embed')?u.href:`https://www.google.com/maps?q=${encodeURIComponent(u.href)}&output=embed`}catch{return null}}

document.addEventListener('alpine:init',()=>Alpine.data('cmsApp',()=>({
  dark:localStorage.getItem('cyberind-dark')==='true',
  loading:true,authenticated:false,currentUser:null,mobileMenu:false,page:'dashboard',
  loginForm:{email:'',password:''},loginError:'',loggingIn:false,showPassword:false,
  articles:[],categories:[],search:'',statusFilter:'all',editing:false,saving:false,
  form:{},sourceMode:false,selectedRange:null,toast:null,
  linkModal:false,linkForm:{text:'',url:'',newTab:true,nofollow:false},
  imageModal:false,imageTab:'upload',imageForFeatured:false,uploading:false,
  externalImage:{url:'',alt:''},
  embedModal:false,embedForm:{provider:'youtube',url:''},
  categoryModal:false,newCategory:{name:''},previewModal:false,previewArticleData:null,
  init(){
    this.form=this.emptyForm();
    supabaseClient.auth.getSession().then(async({data})=>{
      if(data.session?.user){const ok=await this.verifyAdmin(data.session.user);if(ok){this.currentUser=data.session.user;this.authenticated=true;await this.loadData()}}
      this.loading=false;
    });
    supabaseClient.auth.onAuthStateChange(async(_event,session)=>{
      if(session?.user&&!this.authenticated){const ok=await this.verifyAdmin(session.user);if(ok){this.currentUser=session.user;this.authenticated=true;await this.loadData()}}
      if(!session){this.authenticated=false;this.currentUser=null}
    });
  },
  get pageTitle(){return this.page==='dashboard'?'Dashboard':this.page==='articles'?'Artikel':this.page==='editor'?(this.editing?'Edit Artikel':'Tulis Artikel'):'Cyberind CMS'},
  get publishedCount(){return this.articles.filter(a=>a.status==='published').length},
  get draftCount(){return this.articles.filter(a=>a.status==='draft').length},
  get totalViews(){return this.articles.reduce((s,a)=>s+Number(a.views||0),0)},
  get filteredArticles(){
    const q=this.search.trim().toLowerCase();
    return this.articles.filter(a=>(!q||(a.title||'').toLowerCase().includes(q)||(a.slug||'').toLowerCase().includes(q)||(a.excerpt||'').toLowerCase().includes(q))&&(this.statusFilter==='all'||a.status===this.statusFilter));
  },
  get wordCount(){return wordCountFromHTML(this.sourceMode?this.form.content:(this.$refs.editor?.innerHTML||''))},
  emptyForm(){return{id:null,title:'',slug:'',excerpt:'',content:'',featured_image:'',category_id:'',author_name:'Cyberind.id',status:'draft',seo_title:'',seo_description:'',views:0,published_at:null,created_at:null,updated_at:null,tags:''}},
  notify(message,type='success'){this.toast={message,type};setTimeout(()=>{this.toast=null},3200)},
  async login(){
    this.loggingIn=true;this.loginError='';
    const {data,error}=await supabaseClient.auth.signInWithPassword({email:this.loginForm.email.trim(),password:this.loginForm.password});
    if(error){this.loginError=error.message;this.loggingIn=false;return}
    const ok=await this.verifyAdmin(data.user);
    if(!ok){await supabaseClient.auth.signOut();this.loginError='Login berhasil, tetapi akun ini bukan administrator Cyberind CMS.';this.loggingIn=false;return}
    this.currentUser=data.user;this.authenticated=true;await this.loadData();this.loggingIn=false;
  },
  async verifyAdmin(user){if(!user)return false;const{data,error}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&!!data},
  async logout(){await supabaseClient.auth.signOut();this.authenticated=false;this.currentUser=null;this.page='dashboard'},
  async loadData(){await Promise.all([this.loadArticles(),this.loadCategories()])},
  async loadArticles(){
    const{data,error}=await supabaseClient.from('articles').select('id,title,slug,excerpt,content,featured_image,category_id,author_name,status,seo_title,seo_description,views,published_at,created_at,updated_at,categories(id,name,slug)').order('created_at',{ascending:false});
    if(error){this.notify(error.message,'error');return}this.articles=data||[];
  },
  async loadCategories(){
    const{data,error}=await supabaseClient.from('categories').select('id,name,slug').order('name',{ascending:true});
    if(error){this.notify(error.message,'error');return}this.categories=data||[];
  },
  newArticle(){
    this.editing=false;this.form=this.emptyForm();this.sourceMode=false;this.selectedRange=null;this.page='editor';
    this.$nextTick(()=>this.mountEditorContent());
  },
  editArticle(article){
    this.editing=true;
    this.form={...this.emptyForm(),id:article.id,title:article.title||'',slug:article.slug||'',excerpt:article.excerpt||'',content:sanitizeHTML(article.content||''),featured_image:article.featured_image||'',category_id:article.category_id||'',author_name:article.author_name||'Cyberind.id',status:article.status||'draft',seo_title:article.seo_title||'',seo_description:article.seo_description||'',views:Number(article.views||0),published_at:article.published_at||null,created_at:article.created_at||null,updated_at:article.updated_at||null,tags:''};
    this.sourceMode=false;this.selectedRange=null;this.page='editor';
    this.$nextTick(()=>{this.mountEditorContent();this.loadArticleTags(article.id)});
  },
  mountEditorContent(attempt=0){
    const editor=this.$refs.editor;
    if(!editor){if(attempt<40)setTimeout(()=>this.mountEditorContent(attempt+1),50);return}
    const content=sanitizeHTML(this.form.content||'');editor.innerHTML=content;this.form.content=content;
  },
  async loadArticleTags(articleId){
    const{data,error}=await supabaseClient.from('article_tags').select('tag_id,tags(id,name,slug)').eq('article_id',articleId);
    if(error){this.form.tags='';return}
    this.form.tags=(data||[]).map(r=>r.tags?.name).filter(Boolean).join(', ');
  },
  autoSlug(){if(!this.editing||!this.form.slug)this.form.slug=slugify(this.form.title)},
  saveSelection(){const s=window.getSelection();if(s?.rangeCount)this.selectedRange=s.getRangeAt(0).cloneRange()},
  restoreSelection(){if(!this.selectedRange)return;const s=window.getSelection();try{s.removeAllRanges();s.addRange(this.selectedRange)}catch{}},
  syncEditorToForm(){const e=this.$refs.editor;if(e&&!this.sourceMode)this.form.content=sanitizeHTML(e.innerHTML||'');return this.form.content},
  editorCommand(command,value=null){if(this.sourceMode)return;const e=this.$refs.editor;if(!e)return;e.focus();this.restoreSelection();document.execCommand(command,false,value);this.saveSelection();this.syncEditorToForm()},
  formatBlock(tag){if(tag)this.editorCommand('formatBlock',tag)},
  toggleSource(){
    if(!this.sourceMode){
      const e=this.$refs.editor;if(!e)return;
      this.form.content=sanitizeHTML(e.innerHTML||'');this.sourceMode=true;
    }else{
      this.form.content=sanitizeHTML(this.form.content||'');this.sourceMode=false;
      this.$nextTick(()=>this.mountEditorContent());
    }
  },
  openLinkModal(){this.saveSelection();this.linkForm={text:this.getSelectedText(),url:'',newTab:true,nofollow:false};this.linkModal=true},
  getSelectedText(){const s=window.getSelection();return s?s.toString():''},
  insertLink(){
    const url=safeURL(this.linkForm.url);if(!url){this.notify('URL tidak valid.','error');return}
    const text=this.linkForm.text||url;this.restoreSelection();const e=this.$refs.editor;if(!e)return;e.focus();
    const selected=this.getSelectedText();
    if(selected)document.execCommand('createLink',false,url);else document.execCommand('insertHTML',false,`<a href="${escapeHTML(url)}">${escapeHTML(text)}</a>`);
    e.querySelectorAll('a').forEach(a=>{if(a.getAttribute('href')===url){if(this.linkForm.newTab){a.target='_blank';a.rel=this.linkForm.nofollow?'noopener noreferrer nofollow':'noopener noreferrer'}else{a.removeAttribute('target');a.rel=this.linkForm.nofollow?'nofollow':''}}});
    this.linkModal=false;this.saveSelection();this.syncEditorToForm();
  },
  openImageModal(featured=false){this.saveSelection();this.imageForFeatured=featured;this.imageTab='upload';this.externalImage={url:'',alt:''};this.imageModal=true},
  async uploadImage(event){
    const file=event.target.files?.[0];if(!file)return;
    if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){this.notify('Format gambar tidak didukung.','error');return}
    if(file.size>5*1024*1024){this.notify('Ukuran gambar maksimal 5 MB.','error');return}
    this.uploading=true;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`articles/${crypto.randomUUID()}.${ext}`;
    const{error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});
    if(error){this.uploading=false;this.notify('Upload gagal: '+error.message,'error');return}
    const{data}=supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);this.insertImageURL(data.publicUrl,'Cyberind.id');this.uploading=false;this.imageModal=false;
  },
  insertExternalImage(){const u=safeHttpsURL(this.externalImage.url);if(!u){this.notify('URL gambar harus HTTPS dan valid.','error');return}this.insertImageURL(u.href,this.externalImage.alt||'Cyberind.id');this.imageModal=false},
  insertImageURL(url,alt='Cyberind.id'){
    if(this.imageForFeatured){this.form.featured_image=url;return}
    this.restoreSelection();const e=this.$refs.editor;if(!e)return;e.focus();document.execCommand('insertHTML',false,`<p><img src="${escapeHTML(url)}" alt="${escapeHTML(alt)}" loading="lazy"></p>`);this.saveSelection();this.syncEditorToForm()
  },
  openEmbedModal(){this.saveSelection();this.embedForm={provider:'youtube',url:''};this.embedModal=true},
  insertEmbed(){
    const p=this.embedForm.provider,u=this.embedForm.url.trim();let src=null;
    if(p==='youtube')src=youtubeEmbed(u);if(p==='vimeo')src=vimeoEmbed(u);if(p==='spotify')src=spotifyEmbed(u);if(p==='soundcloud')src=soundcloudEmbed(u);if(p==='maps')src=mapsEmbed(u);
    if(p==='iframe'){try{const x=new URL(u);if(x.protocol==='https:'&&hostAllowed(x.hostname))src=x.href}catch{}}
    if(!src){this.notify('URL embed tidak valid atau tidak didukung.','error');return}
    this.restoreSelection();const e=this.$refs.editor;if(!e)return;e.focus();
    const html=`<p><iframe src="${escapeHTML(src)}" title="${escapeHTML(p)}" loading="lazy" allowfullscreen></iframe></p>`;
    document.execCommand('insertHTML',false,html);this.saveSelection();this.syncEditorToForm();this.embedModal=false
  },
  async saveArticle(){
    if(this.saving)return;this.saving=true;
    if(this.sourceMode)this.form.content=sanitizeHTML(this.form.content||'');else{const e=this.$refs.editor;if(!e){this.notify('Editor belum siap. Coba lagi.','error');this.saving=false;return}this.form.content=sanitizeHTML(e.innerHTML||'')}
    const title=this.form.title.trim(),slug=slugify(this.form.slug||this.form.title);
    if(!title){this.notify('Judul artikel wajib diisi.','error');this.saving=false;return}
    if(!slug){this.notify('Slug tidak valid.','error');this.saving=false;return}
    if(!this.form.content.trim()){this.notify('Isi artikel masih kosong.','error');this.saving=false;return}
    const publishedAt=this.form.status==='published'?(this.form.published_at||new Date().toISOString()):null;
    const payload={title,slug,excerpt:this.form.excerpt.trim()||null,content:this.form.content,featured_image:this.form.featured_image||null,category_id:this.form.category_id||null,author_name:this.form.author_name.trim()||'Cyberind.id',status:this.form.status,seo_title:this.form.seo_title.trim()||null,seo_description:this.form.seo_description.trim()||null,published_at:publishedAt};
    let articleId=this.form.id;
    let error;
    if(articleId){({error}=await supabaseClient.from('articles').update(payload).eq('id',articleId))}else{const r=await supabaseClient.from('articles').insert(payload).select('id').single();error=r.error;articleId=r.data?.id}
    if(error){this.notify('Gagal menyimpan: '+error.message,'error');this.saving=false;return}
    await this.saveTags(articleId,this.form.tags||'');
    await this.loadArticles();this.form.id=articleId;this.editing=true;this.notify('Artikel berhasil disimpan.');this.saving=false
  },
  async saveTags(articleId,raw){
    const names=[...new Set(raw.split(',').map(x=>x.trim()).filter(Boolean))];await supabaseClient.from('article_tags').delete().eq('article_id',articleId);
    for(const name of names){
      const slug=slugify(name);if(!slug)continue;
      let{data}=await supabaseClient.from('tags').select('id').eq('slug',slug).maybeSingle();
      if(!data){const r=await supabaseClient.from('tags').insert({name,slug}).select('id').single();data=r.data}
      if(data?.id)await supabaseClient.from('article_tags').insert({article_id:articleId,tag_id:data.id})
    }
  },
  async deleteArticle(article){
    if(!confirm(`Hapus artikel "${article.title}"?`))return;
    const{error}=await supabaseClient.from('articles').delete().eq('id',article.id);if(error){this.notify(error.message,'error');return}
    await this.loadArticles();this.notify('Artikel berhasil dihapus.')
  },
  previewArticle(article){this.previewArticleData=article;this.previewModal=true},
  formatDate(v){if(!v)return '-';try{return new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return v}},
  async createCategory(){
    const name=this.newCategory.name.trim();if(!name)return;
    const slug=slugify(name);const{data,error}=await supabaseClient.from('categories').insert({name,slug}).select('id,name,slug').single();
    if(error){this.notify(error.message,'error');return}this.categories.push(data);this.form.category_id=data.id;this.newCategory.name='';this.categoryModal=false;this.notify('Kategori ditambahkan.')
  }
})); 
</script>
</head>
<body>
<div x-show="loading" x-cloak class="fixed inset-0 z-[999] flex items-center justify-center bg-black/70"><div class="text-center text-white"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-red-500 mb-4"></i><p>Memuat Cyberind CMS...</p></div></div>

<template x-if="!authenticated">
<div class="min-h-screen flex items-center justify-center p-5">
<div class="w-full max-w-md">
<div class="text-center mb-8"><img src="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png" class="w-20 h-20 mx-auto mb-4 object-contain"><h1 class="text-3xl font-bold">Cyberind <span class="text-red-500">CMS</span></h1><p class="text-neutral-500 mt-2">Content Management System</p></div>
<div class="glass rounded-2xl p-7 shadow-xl">
<form @submit.prevent="login">
<label class="block text-sm font-medium mb-2">Email</label><input x-model="loginForm.email" type="email" required autocomplete="username" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 outline-none focus:ring-2 focus:ring-red-500 mb-5" placeholder="admin@example.com">
<label class="block text-sm font-medium mb-2">Password</label><div class="relative"><input x-model="loginForm.password" :type="showPassword?'text':'password'" required autocomplete="current-password" class="w-full px-4 py-3 pr-12 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 outline-none focus:ring-2 focus:ring-red-500" placeholder="••••••••"><button type="button" @click="showPassword=!showPassword" class="absolute right-4 top-3 text-neutral-500"><i :class="showPassword?'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i></button></div>
<div x-show="loginError" x-text="loginError" class="mt-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 text-sm"></div>
<button :disabled="loggingIn" class="w-full mt-6 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold disabled:opacity-50"><i :class="loggingIn?'fa-solid fa-circle-notch fa-spin':'fa-solid fa-right-to-bracket'" class="mr-2"></i><span x-text="loggingIn?'Memproses...':'Masuk CMS'"></span></button>
</form>
</div></div></div>
</template>

<template x-if="authenticated">
<div>
<aside class="sidebar fixed top-0 left-0 bottom-0 bg-white dark:bg-neutral-950 border-r dark:border-neutral-800 flex flex-col" :class="{'open':mobileMenu}">
<div class="p-6 border-b dark:border-neutral-800"><div class="flex items-center gap-3"><img src="https://www.cyberind.my.id/assets/images/logo-cyberind.id.png" class="w-11 h-11 object-contain"><div><div class="font-bold">Cyberind <span class="text-red-500">CMS</span></div><div class="text-xs text-neutral-500">Admin Panel</div></div></div></div>
<nav class="flex-1 p-4 overflow-y-auto scrollbar">
<button @click="page='dashboard';mobileMenu=false" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1" :class="page==='dashboard'?'bg-red-500 text-white':'hover:bg-neutral-100 dark:hover:bg-neutral-900'"><i class="fa-solid fa-chart-line w-5"></i>Dashboard</button>
<button @click="page='articles';mobileMenu=false" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1" :class="page==='articles'?'bg-red-500 text-white':'hover:bg-neutral-100 dark:hover:bg-neutral-900'"><i class="fa-solid fa-newspaper w-5"></i>Artikel</button>
<button @click="newArticle();mobileMenu=false" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 hover:bg-neutral-100 dark:hover:bg-neutral-900"><i class="fa-solid fa-pen-to-square w-5"></i>Tulis Artikel</button>
<div class="mt-6 mb-2 px-4 text-xs uppercase tracking-wider text-neutral-400">Website</div>
<a href="/blog/" target="_blank" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl mb-1 hover:bg-neutral-100 dark:hover:bg-neutral-900"><i class="fa-solid fa-globe w-5"></i>Blog<i class="fa-solid fa-arrow-up-right-from-square text-xs ml-auto"></i></a>
<a href="/" target="_blank" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-900"><i class="fa-solid fa-house w-5"></i>Homepage<i class="fa-solid fa-arrow-up-right-from-square text-xs ml-auto"></i></a>
</nav>
<div class="p-4 border-t dark:border-neutral-800"><div class="flex items-center gap-3 mb-4"><div class="w-9 h-9 rounded-full bg-red-500 text-white flex items-center justify-center"><i class="fa-solid fa-user-shield"></i></div><div class="min-w-0"><div class="font-semibold text-sm truncate" x-text="currentUser?.email||'Administrator'"></div><div class="text-xs text-neutral-500">Administrator</div></div></div><button @click="logout" class="w-full py-2.5 rounded-xl border dark:border-neutral-700 hover:bg-red-500 hover:text-white hover:border-red-500 transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>Logout</button></div>
</aside>

<main class="main min-h-screen">
<header class="sticky top-0 z-40 glass border-b dark:border-neutral-800"><div class="px-5 md:px-8 py-4 flex items-center justify-between"><div class="flex items-center gap-4"><button @click="mobileMenu=!mobileMenu" class="md:hidden w-10 h-10 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800"><i class="fa-solid fa-bars"></i></button><div><h1 class="font-bold text-lg" x-text="pageTitle"></h1><p class="text-xs text-neutral-500 hidden sm:block">Kelola konten Cyberind.id</p></div></div><div class="flex items-center gap-2"><button @click="dark=!dark;localStorage.setItem('cyberind-dark',dark)" class="w-10 h-10 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800"><i :class="dark?'fa-solid fa-sun':'fa-solid fa-moon'"></i></button><a href="/blog/" target="_blank" class="hidden sm:flex w-10 h-10 rounded-xl items-center justify-center hover:bg-neutral-100 dark:hover:bg-neutral-800"><i class="fa-solid fa-globe"></i></a></div></div></header>

<div class="p-5 md:p-8">
<template x-if="page==='dashboard'"><div>
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-7"><div><h2 class="text-2xl font-bold">Dashboard</h2><p class="text-neutral-500 mt-1">Selamat datang kembali di Cyberind CMS.</p></div><button @click="newArticle()" class="px-5 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold"><i class="fa-solid fa-plus mr-2"></i>Artikel Baru</button></div>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
<div class="glass rounded-2xl p-5"><span class="text-neutral-500">Total Artikel</span><div class="text-3xl font-bold mt-3" x-text="articles.length"></div></div>
<div class="glass rounded-2xl p-5"><span class="text-neutral-500">Published</span><div class="text-3xl font-bold mt-3" x-text="publishedCount"></div></div>
<div class="glass rounded-2xl p-5"><span class="text-neutral-500">Draft</span><div class="text-3xl font-bold mt-3" x-text="draftCount"></div></div>
<div class="glass rounded-2xl p-5"><span class="text-neutral-500">Views</span><div class="text-3xl font-bold mt-3" x-text="totalViews"></div></div>
</div>
<div class="glass rounded-2xl overflow-hidden"><div class="p-5 border-b dark:border-neutral-800 flex justify-between"><h3 class="font-bold">Artikel Terbaru</h3><button @click="page='articles'" class="text-sm text-red-500">Lihat Semua</button></div><div class="divide-y dark:divide-neutral-800"><template x-for="a in articles.slice(0,5)" :key="a.id"><div class="p-5 flex items-center gap-4"><div class="w-16 h-12 rounded-lg bg-neutral-100 dark:bg-neutral-800 overflow-hidden shrink-0"><template x-if="a.featured_image"><img :src="a.featured_image" class="w-full h-full object-cover"></template><template x-if="!a.featured_image"><div class="w-full h-full flex items-center justify-center"><i class="fa-solid fa-newspaper text-neutral-400"></i></div></template></div><div class="min-w-0 flex-1"><div class="font-semibold truncate" x-text="a.title"></div><div class="text-xs text-neutral-500 mt-1" x-text="formatDate(a.created_at)"></div></div><span class="text-xs px-3 py-1.5 rounded-full" :class="a.status==='published'?'bg-green-500/10 text-green-500':'bg-yellow-500/10 text-yellow-600'" x-text="a.status==='published'?'Published':'Draft'"></span></div></template></div></div>
</div></template>

<template x-if="page==='articles'"><div>
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6"><div><h2 class="text-2xl font-bold">Artikel</h2><p class="text-neutral-500">Kelola semua artikel.</p></div><button @click="newArticle()" class="px-5 py-3 rounded-xl bg-red-500 text-white font-semibold"><i class="fa-solid fa-plus mr-2"></i>Artikel Baru</button></div>
<div class="glass rounded-2xl p-4 mb-5 flex flex-col md:flex-row gap-3"><input x-model="search" class="flex-1 px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700" placeholder="Cari judul, slug, excerpt..."><select x-model="statusFilter" class="px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700"><option value="all">Semua Status</option><option value="published">Published</option><option value="draft">Draft</option></select></div>
<div class="glass rounded-2xl overflow-hidden"><div class="overflow-x-auto"><table class="w-full min-w-[760px]"><thead class="border-b dark:border-neutral-800 text-left text-xs uppercase text-neutral-500"><tr><th class="px-5 py-4">Artikel</th><th class="px-5 py-4">Kategori</th><th class="px-5 py-4">Status</th><th class="px-5 py-4">Views</th><th class="px-5 py-4">Tanggal</th><th class="px-5 py-4 text-right">Aksi</th></tr></thead><tbody class="divide-y dark:divide-neutral-800"><template x-for="a in filteredArticles" :key="a.id"><tr class="hover:bg-neutral-50 dark:hover:bg-neutral-900/50"><td class="px-5 py-4"><div class="font-semibold" x-text="a.title"></div><div class="text-xs text-neutral-500" x-text="'/'+a.slug"></div></td><td class="px-5 py-4 text-sm" x-text="a.categories?.name||'-'"></td><td class="px-5 py-4"><span class="text-xs px-3 py-1.5 rounded-full" :class="a.status==='published'?'bg-green-500/10 text-green-500':'bg-yellow-500/10 text-yellow-600'" x-text="a.status==='published'?'Published':'Draft'"></span></td><td class="px-5 py-4 text-sm" x-text="a.views||0"></td><td class="px-5 py-4 text-sm text-neutral-500 whitespace-nowrap" x-text="formatDate(a.created_at)"></td><td class="px-5 py-4"><div class="flex justify-end gap-1"><button @click="previewArticle(a)" title="Preview" class="w-9 h-9 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800"><i class="fa-solid fa-eye"></i></button><button @click="editArticle(a)" title="Edit" class="w-9 h-9 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800 text-blue-500"><i class="fa-solid fa-pen"></i></button><a x-show="a.status==='published'" :href="'/blog/article.html?slug='+encodeURIComponent(a.slug)" target="_blank" class="w-9 h-9 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800 flex items-center justify-center"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button @click="deleteArticle(a)" title="Hapus" class="w-9 h-9 rounded-lg hover:bg-red-500/10 text-red-500"><i class="fa-solid fa-trash"></i></button></div></td></tr></template><template x-if="filteredArticles.length===0"><tr><td colspan="6" class="px-5 py-16 text-center text-neutral-500">Tidak ada artikel ditemukan.</td></tr></template></tbody></table></div></div>
</div></template>

<template x-if="page==='editor'"><div>
<div class="flex flex-col lg:flex-row gap-6">
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between mb-5"><div><button @click="page='articles'" class="text-sm text-neutral-500 hover:text-red-500"><i class="fa-solid fa-arrow-left mr-2"></i>Kembali ke Artikel</button><h2 class="text-2xl font-bold mt-2" x-text="editing?'Edit Artikel':'Tulis Artikel Baru'"></h2></div><button @click="saveArticle()" :disabled="saving" class="px-5 py-3 rounded-xl bg-red-500 text-white font-semibold disabled:opacity-50"><i :class="saving?'fa-solid fa-circle-notch fa-spin':'fa-solid fa-floppy-disk'" class="mr-2"></i><span x-text="saving?'Menyimpan...':'Simpan Artikel'"></span></button></div>
<div class="glass rounded-2xl overflow-hidden mb-5">
<div class="p-4 border-b dark:border-neutral-800"><input x-model="form.title" @input="autoSlug()" class="w-full text-2xl md:text-3xl font-bold bg-transparent outline-none" placeholder="Judul artikel..."><div class="text-xs text-neutral-500 mt-2">Slug: <span x-text="'/'+(form.slug||slugify(form.title))"></span></div></div>
<div class="border-b dark:border-neutral-800 p-3"><div class="toolbar">
<select @change="formatBlock($event.target.value);$event.target.value=''" class="h-9 rounded-lg border bg-white dark:bg-neutral-900 px-2 text-sm"><option value="">Format</option><option value="p">Paragraf</option><option value="h2">H2</option><option value="h3">H3</option><option value="h4">H4</option><option value="blockquote">Quote</option><option value="pre">Code</option></select>
<button @mousedown.prevent="editorCommand('bold')" class="tool-btn"><i class="fa-solid fa-bold"></i></button><button @mousedown.prevent="editorCommand('italic')" class="tool-btn"><i class="fa-solid fa-italic"></i></button><button @mousedown.prevent="editorCommand('underline')" class="tool-btn"><i class="fa-solid fa-underline"></i></button><button @mousedown.prevent="editorCommand('strikeThrough')" class="tool-btn"><i class="fa-solid fa-strikethrough"></i></button><button @mousedown.prevent="editorCommand('insertUnorderedList')" class="tool-btn"><i class="fa-solid fa-list-ul"></i></button><button @mousedown.prevent="editorCommand('insertOrderedList')" class="tool-btn"><i class="fa-solid fa-list-ol"></i></button><button @mousedown.prevent="editorCommand('justifyLeft')" class="tool-btn"><i class="fa-solid fa-align-left"></i></button><button @mousedown.prevent="editorCommand('justifyCenter')" class="tool-btn"><i class="fa-solid fa-align-center"></i></button><button @mousedown.prevent="editorCommand('justifyRight')" class="tool-btn"><i class="fa-solid fa-align-right"></i></button><button @mousedown.prevent="openLinkModal()" class="tool-btn"><i class="fa-solid fa-link"></i></button><button @mousedown.prevent="editorCommand('unlink')" class="tool-btn"><i class="fa-solid fa-link-slash"></i></button><button @mousedown.prevent="openImageModal(false)" class="tool-btn"><i class="fa-solid fa-image"></i></button><button @mousedown.prevent="openEmbedModal()" class="tool-btn"><i class="fa-solid fa-code"></i></button><button @mousedown.prevent="editorCommand('insertHorizontalRule')" class="tool-btn"><i class="fa-solid fa-minus"></i></button><button @mousedown.prevent="editorCommand('removeFormat')" class="tool-btn"><i class="fa-solid fa-eraser"></i></button><button @mousedown.prevent="toggleSource()" class="tool-btn" title="HTML Source"><i class="fa-solid fa-file-code"></i></button>
</div></div>
<div x-show="!sourceMode" x-ref="editor" contenteditable="true" class="editor p-6" data-placeholder="Mulai menulis artikel di sini..." @mouseup="saveSelection();syncEditorToForm()" @keyup="saveSelection();syncEditorToForm()" @input="syncEditorToForm()" @focus="saveSelection()"></div>
<textarea x-show="sourceMode" x-model="form.content" class="w-full min-h-[500px] p-6 bg-neutral-950 text-green-400 font-mono text-sm outline-none resize-y" placeholder="<h2>HTML artikel...</h2>"></textarea>
<div class="px-5 py-3 border-t dark:border-neutral-800 text-xs text-neutral-500 flex justify-between"><span x-text="sourceMode?'HTML Source Mode':'Visual Editor'"></span><span><span x-text="wordCount"></span> kata</span></div>
</div>

<div class="glass rounded-2xl p-5 mb-5"><h3 class="font-bold mb-4">Excerpt</h3><textarea x-model="form.excerpt" rows="4" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700" placeholder="Ringkasan artikel..."></textarea></div>
<div class="glass rounded-2xl p-5 mb-5"><h3 class="font-bold mb-4">SEO</h3><label class="block text-sm font-semibold mb-2">SEO Title</label><input x-model="form.seo_title" maxlength="70" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 mb-4"><label class="block text-sm font-semibold mb-2">SEO Description</label><textarea x-model="form.seo_description" maxlength="160" rows="3" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700"></textarea></div>
</div>

<div class="w-full lg:w-80 shrink-0">
<div class="glass rounded-2xl p-5 mb-5"><h3 class="font-bold mb-4">Publikasi</h3><label class="text-sm font-semibold">Status</label><select x-model="form.status" class="w-full mt-2 px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700"><option value="draft">Draft</option><option value="published">Published</option></select><label class="block text-sm font-semibold mt-4 mb-2">Author</label><input x-model="form.author_name" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700"><label class="block text-sm font-semibold mt-4 mb-2">Slug</label><input x-model="form.slug" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700"></div>
<div class="glass rounded-2xl p-5 mb-5"><h3 class="font-bold mb-4">Featured Image</h3><template x-if="form.featured_image"><img :src="form.featured_image" class="w-full aspect-video object-cover rounded-xl mb-3"></template><button @click="openImageModal(true)" class="w-full py-3 rounded-xl border border-dashed dark:border-neutral-700 hover:border-red-500 hover:text-red-500"><i class="fa-solid fa-image mr-2"></i><span x-text="form.featured_image?'Ganti Gambar':'Pilih Gambar'"></span></button></div>
<div class="glass rounded-2xl p-5 mb-5"><h3 class="font-bold mb-4">Kategori</h3><select x-model="form.category_id" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700"><option value="">Tanpa kategori</option><template x-for="c in categories" :key="c.id"><option :value="c.id" x-text="c.name"></option></template></select><button @click="categoryModal=true" class="text-sm text-red-500 mt-3">+ Tambah kategori</button></div>
<div class="glass rounded-2xl p-5"><h3 class="font-bold mb-4">Tags</h3><input x-model="form.tags" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700" placeholder="cybersecurity, osint, tutorial"></div>
</div>
</div>
</div></template>
</div></main>

<!-- link modal -->
<div x-show="linkModal" x-cloak class="fixed inset-0 z-[300] modal-bg flex items-center justify-center p-4"><div @click.outside="linkModal=false" class="w-full max-w-lg glass rounded-2xl p-6"><div class="flex justify-between items-center mb-5"><h3 class="font-bold text-lg">Tambah Link</h3><button @click="linkModal=false"><i class="fa-solid fa-xmark"></i></button></div><input x-model="linkForm.text" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 mb-3" placeholder="Teks link"><input x-model="linkForm.url" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 mb-4" placeholder="https://example.com"><label class="flex items-center gap-2 mb-2"><input type="checkbox" x-model="linkForm.newTab"> Buka tab baru</label><label class="flex items-center gap-2 mb-5"><input type="checkbox" x-model="linkForm.nofollow"> rel="nofollow"</label><button @click="insertLink()" class="w-full py-3 rounded-xl bg-red-500 text-white font-semibold">Sisipkan Link</button></div></div>

<!-- image modal -->
<div x-show="imageModal" x-cloak class="fixed inset-0 z-[300] modal-bg flex items-center justify-center p-4"><div @click.outside="imageModal=false" class="w-full max-w-lg glass rounded-2xl p-6"><div class="flex justify-between items-center mb-5"><h3 class="font-bold text-lg" x-text="imageForFeatured?'Featured Image':'Sisipkan Gambar'"></h3><button @click="imageModal=false"><i class="fa-solid fa-xmark"></i></button></div><div class="flex gap-2 mb-5"><button @click="imageTab='upload'" class="flex-1 py-2 rounded-lg" :class="imageTab==='upload'?'bg-red-500 text-white':'bg-neutral-100 dark:bg-neutral-800'">Upload</button><button @click="imageTab='external'" class="flex-1 py-2 rounded-lg" :class="imageTab==='external'?'bg-red-500 text-white':'bg-neutral-100 dark:bg-neutral-800'">External URL</button></div><div x-show="imageTab==='upload'"><input type="file" accept="image/jpeg,image/png,image/webp,image/gif" @change="uploadImage" class="w-full p-3 border rounded-xl"><p class="text-xs text-neutral-500 mt-2">JPG, PNG, WEBP, GIF · maksimal 5 MB.</p><div x-show="uploading" class="text-sm text-red-500 mt-3"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Uploading...</div></div><div x-show="imageTab==='external'"><input x-model="externalImage.url" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 mb-3" placeholder="https://..."><input x-model="externalImage.alt" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 mb-4" placeholder="Alt text"><button @click="insertExternalImage()" class="w-full py-3 rounded-xl bg-red-500 text-white font-semibold">Gunakan Gambar</button></div></div></div>

<!-- embed modal -->
<div x-show="embedModal" x-cloak class="fixed inset-0 z-[300] modal-bg flex items-center justify-center p-4"><div @click.outside="embedModal=false" class="w-full max-w-lg glass rounded-2xl p-6"><div class="flex justify-between items-center mb-5"><h3 class="font-bold text-lg">Embed Media</h3><button @click="embedModal=false"><i class="fa-solid fa-xmark"></i></button></div><select x-model="embedForm.provider" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 mb-3"><option value="youtube">YouTube</option><option value="vimeo">Vimeo</option><option value="spotify">Spotify</option><option value="soundcloud">SoundCloud</option><option value="maps">Google Maps</option><option value="iframe">Custom HTTPS iframe</option></select><input x-model="embedForm.url" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 mb-4" placeholder="Tempel URL media..."><button @click="insertEmbed()" class="w-full py-3 rounded-xl bg-red-500 text-white font-semibold">Sisipkan Embed</button><p class="text-xs text-neutral-500 mt-3">Iframe custom hanya menerima domain yang masuk daftar aman.</p></div></div>

<!-- category modal -->
<div x-show="categoryModal" x-cloak class="fixed inset-0 z-[300] modal-bg flex items-center justify-center p-4"><div @click.outside="categoryModal=false" class="w-full max-w-md glass rounded-2xl p-6"><div class="flex justify-between items-center mb-5"><h3 class="font-bold text-lg">Tambah Kategori</h3><button @click="categoryModal=false"><i class="fa-solid fa-xmark"></i></button></div><input x-model="newCategory.name" @keydown.enter.prevent="createCategory()" class="w-full px-4 py-3 rounded-xl border bg-white dark:bg-neutral-900 dark:border-neutral-700 mb-4" placeholder="Nama kategori"><button @click="createCategory()" class="w-full py-3 rounded-xl bg-red-500 text-white font-semibold">Tambah</button></div></div>

<!-- preview -->
<div x-show="previewModal" x-cloak class="fixed inset-0 z-[300] modal-bg flex items-center justify-center p-4"><div @click.outside="previewModal=false" class="w-full max-w-4xl max-h-[90vh] overflow-y-auto glass rounded-2xl p-6 scrollbar"><div class="flex justify-between items-center mb-6"><h3 class="font-bold text-xl">Preview Artikel</h3><button @click="previewModal=false"><i class="fa-solid fa-xmark"></i></button></div><template x-if="previewArticleData"><article><img x-show="previewArticleData.featured_image" :src="previewArticleData.featured_image" class="w-full max-h-80 object-cover rounded-2xl mb-6"><h1 class="text-3xl md:text-4xl font-bold" x-text="previewArticleData.title"></h1><p class="text-neutral-500 mt-2" x-text="previewArticleData.excerpt"></p><div class="prose-content mt-7" x-html="sanitizeHTML(previewArticleData.content||'')"></div></article></template></div></div>

<div x-show="toast" x-cloak class="fixed bottom-5 right-5 z-[500] toast"><div class="px-5 py-3 rounded-xl shadow-xl text-white" :class="toast?.type==='error'?'bg-red-600':'bg-neutral-900'" x-text="toast?.message"></div></div>
</div>
</template>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
