<!DOCTYPE html>
<html lang="id"
      x-data="cmsApp()"
      x-init="init()"
      :class="{ 'dark': darkMode }">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title x-text="pageTitle">Cyberind CMS</title>

    <meta name="description"
          content="Cyberind.id Content Management System">

    <!-- =========================================================
         TAILWIND
    ========================================================== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        heading: ['PT Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- =========================================================
         FONT
    ========================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap"
          rel="stylesheet">

    <!-- =========================================================
         FONT AWESOME
    ========================================================== -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- =========================================================
         SUPABASE
    ========================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- =========================================================
         DOMPURIFY
    ========================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- =========================================================
         ALPINE
    ========================================================== -->
    <script defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>

        /* =====================================================
           ROOT
        ====================================================== */

        :root {
            --red: #dc2626;
            --red-dark: #b91c1c;
            --bg: #f5f5f5;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #171717;
            --muted: #737373;
        }

        html.dark {
            --bg: #09090b;
            --card: #111113;
            --border: #27272a;
            --text: #fafafa;
            --muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }

        /* =====================================================
           SCROLLBAR
        ====================================================== */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #a1a1aa;
            border-radius: 999px;
        }

        /* =====================================================
           SIDEBAR
        ====================================================== */

        .sidebar {
            width: 260px;
            background: var(--card);
            border-right: 1px solid var(--border);
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 50;
            transition: .25s ease;
        }

        .sidebar-hidden {
            transform: translateX(-100%);
        }

        .main {
            margin-left: 260px;
            min-height: 100vh;
        }

        @media(max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }
        }

        /* =====================================================
           NAV
        ====================================================== */

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            color: var(--muted);
            cursor: pointer;
            transition: .2s;
        }

        .nav-item:hover {
            background: rgba(220, 38, 38, .08);
            color: var(--red);
        }

        .nav-item.active {
            background: rgba(220, 38, 38, .1);
            color: var(--red);
            font-weight: 600;
        }

        /* =====================================================
           CARDS
        ====================================================== */

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        /* =====================================================
           INPUT
        ====================================================== */

        .input {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 9px;
            padding: 10px 12px;
            outline: none;
            transition: .2s;
        }

        .input:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(220,38,38,.1);
        }

        /* =====================================================
           BUTTON
        ====================================================== */

        .btn {
            border: 0;
            border-radius: 9px;
            padding: 9px 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--red);
            color: white;
        }

        .btn-primary:hover {
            background: var(--red-dark);
        }

        .btn-secondary {
            background: #f4f4f5;
            color: #27272a;
        }

        html.dark .btn-secondary {
            background: #27272a;
            color: #fafafa;
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        html.dark .btn-danger {
            background: #450a0a;
            color: #fecaca;
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
        }

        /* =====================================================
           EDITOR
        ====================================================== */

        .editor-wrapper {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
        }

        .editor-toolbar {
            border-bottom: 1px solid var(--border);
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: rgba(127,127,127,.04);
        }

        .toolbar-group {
            display: flex;
            gap: 3px;
            padding-right: 6px;
            margin-right: 4px;
            border-right: 1px solid var(--border);
        }

        .toolbar-group:last-child {
            border-right: 0;
        }

        .toolbar-btn {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            border: 0;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .toolbar-btn:hover {
            background: rgba(220,38,38,.1);
            color: var(--red);
        }

        .toolbar-select {
            height: 34px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            padding: 0 8px;
            outline: none;
        }

        .visual-editor {
            min-height: 480px;
            padding: 22px;
            outline: none;
            line-height: 1.8;
            font-size: 16px;
        }

        .visual-editor:empty::before {
            content: attr(data-placeholder);
            color: #a1a1aa;
            pointer-events: none;
        }

        .visual-editor h1,
        .visual-editor h2,
        .visual-editor h3,
        .visual-editor h4,
        .visual-editor h5,
        .visual-editor h6 {
            font-family: 'PT Sans', sans-serif;
            font-weight: 700;
            margin-top: 1.2em;
            margin-bottom: .5em;
        }

        .visual-editor h1 {
            font-size: 2rem;
        }

        .visual-editor h2 {
            font-size: 1.6rem;
        }

        .visual-editor h3 {
            font-size: 1.3rem;
        }

        .visual-editor blockquote {
            border-left: 4px solid var(--red);
            padding-left: 16px;
            margin: 20px 0;
            color: var(--muted);
            font-style: italic;
        }

        .visual-editor pre {
            background: #18181b;
            color: #fafafa;
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .visual-editor code {
            background: rgba(127,127,127,.15);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .visual-editor img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .visual-editor a {
            color: #dc2626;
            text-decoration: underline;
        }

        .visual-editor ul {
            list-style: disc;
            padding-left: 28px;
        }

        .visual-editor ol {
            list-style: decimal;
            padding-left: 28px;
        }

        /* =====================================================
           STATUS
        ====================================================== */

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-draft {
            background: #fef3c7;
            color: #92400e;
        }

        .status-published {
            background: #dcfce7;
            color: #166534;
        }

        /* =====================================================
           MODAL
        ====================================================== */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 25px 80px rgba(0,0,0,.3);
        }

        /* =====================================================
           LOGIN
        ====================================================== */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top,
                    rgba(220,38,38,.15),
                    transparent 40%),
                var(--bg);
        }

        /* =====================================================
           TOAST
        ====================================================== */

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 300;
            min-width: 280px;
            max-width: 420px;
            padding: 14px 16px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        .toast-success {
            background: #16a34a;
        }

        .toast-error {
            background: #dc2626;
        }

        .toast-info {
            background: #2563eb;
        }

        /* =====================================================
           SEO PREVIEW
        ====================================================== */

        .google-preview {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            background: var(--card);
        }

        .google-title {
            color: #1a0dab;
            font-size: 18px;
        }

        html.dark .google-title {
            color: #8ab4f8;
        }

        .google-url {
            color: #188038;
            font-size: 13px;
        }

        html.dark .google-url {
            color: #81c995;
        }

        .google-description {
            color: var(--muted);
            font-size: 13px;
        }

        /* =====================================================
           IMAGE
        ====================================================== */

        .image-preview {
            max-height: 250px;
            object-fit: cover;
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        /* =====================================================
           MOBILE OVERLAY
        ====================================================== */

        .mobile-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 40;
        }

    </style>
</head>

<body>

<!-- =========================================================
     LOGIN
========================================================== -->

<template x-if="!loggedIn">

    <div class="login-page">

        <div class="card w-full max-w-md p-7">

            <div class="text-center mb-7">

                <div class="w-16 h-16 mx-auto rounded-2xl bg-red-600 text-white flex items-center justify-center text-2xl mb-4">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>

                <h1 class="text-2xl font-bold">
                    Cyberind CMS
                </h1>

                <p class="text-sm text-neutral-500 mt-2">
                    Indonesian Cyber Team
                </p>

            </div>

            <form @submit.prevent="login()">

                <div class="mb-4">

                    <label class="block text-sm font-semibold mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        class="input"
                        x-model="loginEmail"
                        autocomplete="username"
                        required
                        placeholder="admin@example.com">

                </div>

                <div class="mb-5">

                    <label class="block text-sm font-semibold mb-2">
                        Password
                    </label>

                    <div class="relative">

                        <input
                            :type="showPassword ? 'text' : 'password'"
                            class="input pr-12"
                            x-model="loginPassword"
                            autocomplete="current-password"
                            required
                            placeholder="••••••••">

                        <button
                            type="button"
                            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 text-neutral-500"
                            @click="showPassword = !showPassword">

                            <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>

                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-full"
                    :disabled="loading">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    <span x-text="loading ? 'Memproses...' : 'Masuk'"></span>

                </button>

            </form>

        </div>

    </div>

</template>


<!-- =========================================================
     ADMIN APP
========================================================== -->

<template x-if="loggedIn">

    <div>

        <!-- MOBILE OVERLAY -->

        <div
            x-show="mobileMenu"
            @click="mobileMenu=false"
            class="mobile-overlay md:hidden">
        </div>


        <!-- =====================================================
             SIDEBAR
        ====================================================== -->

        <aside
            class="sidebar"
            :class="{ 'mobile-open': mobileMenu }">

            <div class="h-full flex flex-col">

                <!-- BRAND -->

                <div class="p-5 border-b border-neutral-200 dark:border-neutral-800">

                    <div class="flex items-center gap-3">

                        <div class="w-10 h-10 rounded-xl bg-red-600 text-white flex items-center justify-center">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>

                        <div>

                            <div class="font-bold">
                                Cyberind CMS
                            </div>

                            <div class="text-xs text-neutral-500">
                                cyberind.my.id
                            </div>

                        </div>

                    </div>

                </div>


                <!-- NAVIGATION -->

                <nav class="flex-1 p-4 overflow-y-auto">

                    <div class="text-[11px] uppercase tracking-wider text-neutral-400 font-bold mb-2 px-3">
                        Dashboard
                    </div>

                    <div
                        class="nav-item"
                        :class="{active: currentPage === 'dashboard'}"
                        @click="navigate('dashboard')">

                        <i class="fa-solid fa-gauge w-5"></i>

                        <span>
                            Dashboard
                        </span>

                    </div>


                    <div class="text-[11px] uppercase tracking-wider text-neutral-400 font-bold mb-2 px-3 mt-6">
                        Konten
                    </div>

                    <div
                        class="nav-item"
                        :class="{active: currentPage === 'posts'}"
                        @click="navigate('posts')">

                        <i class="fa-solid fa-newspaper w-5"></i>

                        <span>
                            Semua Artikel
                        </span>

                    </div>

                    <div
                        class="nav-item"
                        :class="{active: currentPage === 'editor'}"
                        @click="newArticle()">

                        <i class="fa-solid fa-pen-to-square w-5"></i>

                        <span>
                            Tambah Artikel
                        </span>

                    </div>

                    <div
                        class="nav-item"
                        :class="{active: currentPage === 'categories'}"
                        @click="navigate('categories')">

                        <i class="fa-solid fa-folder w-5"></i>

                        <span>
                            Kategori
                        </span>

                    </div>

                    <div
                        class="nav-item"
                        :class="{active: currentPage === 'tags'}"
                        @click="navigate('tags')">

                        <i class="fa-solid fa-tags w-5"></i>

                        <span>
                            Tags
                        </span>

                    </div>

                    <div
                        class="nav-item"
                        :class="{active: currentPage === 'media'}"
                        @click="navigate('media')">

                        <i class="fa-solid fa-images w-5"></i>

                        <span>
                            Media
                        </span>

                    </div>


                    <div class="text-[11px] uppercase tracking-wider text-neutral-400 font-bold mb-2 px-3 mt-6">
                        Website
                    </div>

                    <a
                        href="/"
                        target="_blank"
                        class="nav-item">

                        <i class="fa-solid fa-globe w-5"></i>

                        <span>
                            Lihat Website
                        </span>

                    </a>

                    <a
                        href="/blog"
                        target="_blank"
                        class="nav-item">

                        <i class="fa-solid fa-book-open w-5"></i>

                        <span>
                            Cyberind Journal
                        </span>

                    </a>

                </nav>


                <!-- USER -->

                <div class="p-4 border-t border-neutral-200 dark:border-neutral-800">

                    <div class="flex items-center gap-3 mb-3">

                        <div class="w-9 h-9 rounded-full bg-red-100 dark:bg-red-950 text-red-600 flex items-center justify-center">
                            <i class="fa-solid fa-user"></i>
                        </div>

                        <div class="min-w-0">

                            <div class="text-sm font-semibold truncate">
                                Admin
                            </div>

                            <div
                                class="text-xs text-neutral-500 truncate"
                                x-text="userEmail">
                            </div>

                        </div>

                    </div>

                    <button
                        class="btn btn-secondary w-full"
                        @click="logout()">

                        <i class="fa-solid fa-right-from-bracket"></i>
                        Keluar

                    </button>

                </div>

            </div>

        </aside>


        <!-- =====================================================
             MAIN
        ====================================================== -->

        <main class="main">

            <!-- HEADER -->

            <header class="h-16 border-b border-neutral-200 dark:border-neutral-800 bg-white/80 dark:bg-neutral-950/80 backdrop-blur sticky top-0 z-30">

                <div class="h-full px-4 md:px-6 flex items-center justify-between">

                    <div class="flex items-center gap-3">

                        <button
                            class="btn btn-secondary btn-icon md:hidden"
                            @click="mobileMenu=true">

                            <i class="fa-solid fa-bars"></i>

                        </button>

                        <div>

                            <h1
                                class="font-bold text-lg"
                                x-text="pageTitle">
                            </h1>

                        </div>

                    </div>


                    <div class="flex items-center gap-2">

                        <a
                            href="/"
                            target="_blank"
                            class="btn btn-secondary btn-icon"
                            title="Lihat website">

                            <i class="fa-solid fa-globe"></i>

                        </a>

                        <button
                            class="btn btn-secondary btn-icon"
                            @click="darkMode=!darkMode"
                            title="Tema">

                            <i
                                :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'">
                            </i>

                        </button>

                    </div>

                </div>

            </header>


            <!-- =================================================
                 CONTENT
            ================================================== -->

            <div class="p-4 md:p-6">


                <!-- =================================================
                     DASHBOARD
                ================================================== -->

                <template x-if="currentPage === 'dashboard'">

                    <div>

                        <div class="mb-6">

                            <h2 class="text-2xl font-bold">
                                Dashboard
                            </h2>

                            <p class="text-sm text-neutral-500 mt-1">
                                Kelola Cyberind Journal dari satu tempat.
                            </p>

                        </div>


                        <!-- STATS -->

                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

                            <div class="card p-5">

                                <div class="flex items-center justify-between">

                                    <div>

                                        <div class="text-sm text-neutral-500">
                                            Total Artikel
                                        </div>

                                        <div
                                            class="text-3xl font-bold mt-2"
                                            x-text="stats.total">
                                        </div>

                                    </div>

                                    <div class="w-11 h-11 rounded-xl bg-blue-100 dark:bg-blue-950 text-blue-600 flex items-center justify-center">

                                        <i class="fa-solid fa-newspaper"></i>

                                    </div>

                                </div>

                            </div>


                            <div class="card p-5">

                                <div class="flex items-center justify-between">

                                    <div>

                                        <div class="text-sm text-neutral-500">
                                            Published
                                        </div>

                                        <div
                                            class="text-3xl font-bold mt-2"
                                            x-text="stats.published">
                                        </div>

                                    </div>

                                    <div class="w-11 h-11 rounded-xl bg-green-100 dark:bg-green-950 text-green-600 flex items-center justify-center">

                                        <i class="fa-solid fa-check"></i>

                                    </div>

                                </div>

                            </div>


                            <div class="card p-5">

                                <div class="flex items-center justify-between">

                                    <div>

                                        <div class="text-sm text-neutral-500">
                                            Draft
                                        </div>

                                        <div
                                            class="text-3xl font-bold mt-2"
                                            x-text="stats.draft">
                                        </div>

                                    </div>

                                    <div class="w-11 h-11 rounded-xl bg-yellow-100 dark:bg-yellow-950 text-yellow-600 flex items-center justify-center">

                                        <i class="fa-solid fa-file-pen"></i>

                                    </div>

                                </div>

                            </div>


                            <div class="card p-5">

                                <div class="flex items-center justify-between">

                                    <div>

                                        <div class="text-sm text-neutral-500">
                                            Views
                                        </div>

                                        <div
                                            class="text-3xl font-bold mt-2"
                                            x-text="stats.views">
                                        </div>

                                    </div>

                                    <div class="w-11 h-11 rounded-xl bg-red-100 dark:bg-red-950 text-red-600 flex items-center justify-center">

                                        <i class="fa-solid fa-eye"></i>

                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- QUICK ACTIONS -->

                        <div class="card p-5 mb-6">

                            <h3 class="font-bold mb-4">
                                Quick Actions
                            </h3>

                            <div class="flex flex-wrap gap-3">

                                <button
                                    class="btn btn-primary"
                                    @click="newArticle()">

                                    <i class="fa-solid fa-plus"></i>
                                    Artikel Baru

                                </button>

                                <button
                                    class="btn btn-secondary"
                                    @click="navigate('categories')">

                                    <i class="fa-solid fa-folder-plus"></i>
                                    Kelola Kategori

                                </button>

                                <button
                                    class="btn btn-secondary"
                                    @click="navigate('media')">

                                    <i class="fa-solid fa-upload"></i>
                                    Media

                                </button>

                            </div>

                        </div>


                        <!-- RECENT -->

                        <div class="card overflow-hidden">

                            <div class="p-5 border-b border-neutral-200 dark:border-neutral-800">

                                <div class="flex items-center justify-between">

                                    <h3 class="font-bold">
                                        Artikel Terbaru
                                    </h3>

                                    <button
                                        class="text-sm text-red-600 font-semibold"
                                        @click="navigate('posts')">

                                        Lihat semua

                                    </button>

                                </div>

                            </div>

                            <div class="divide-y divide-neutral-200 dark:divide-neutral-800">

                                <template
                                    x-for="article in articles.slice(0,5)"
                                    :key="article.id">

                                    <div class="p-4 flex items-center gap-4">

                            </template>

                        </div>

                                                </button>

                                    </div>

                                                    class="google-description mt-1"
                                                    x-text="form.seo_description || form.excerpt || 'Deskripsi artikel...'">

                                            </div>

                                        </div>

                                    </div>

                                            <span x-text="form.status"></span>

                                        </span>

                                                Status

                                                <option value="published">
                                                    Published
                                                </option>

                                            </select>

                                        </div>

                                            <label class="block text-sm font-semibold mb-2">

                                            <input

                                            <p class="text-xs text-neutral-500 mt-1">

                                                class="btn btn-secondary flex-1"
                                                @click="saveArticle('draft')">

                                                class="btn btn-primary flex-1"

                                                Publish

<script>

const SUPABASE_URL =
    'https://lwolwingtzqdfsqoopra.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_w8vzcXhO42RrHSopV8Gi9A_ecg6m_0A';

const STORAGE_BUCKET =
    'article-images';

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function cmsApp() {

    return {

        /* =====================================================
           STATE
        ====================================================== */

        loggedIn: false,

        loading: false,

        saving: false,

        darkMode:
            localStorage.getItem('cyberind_cms_dark') === 'true',

        mobileMenu: false,

        currentPage: 'dashboard',

        pageTitle: 'Dashboard',

        userEmail: '',

        loginEmail: '',

        loginPassword: '',

        showPassword: false,

        articles: [],

        categories: [],

        tags: [],

        mediaItems: [],

        search: '',

        statusFilter: 'all',

        categoryFilter: 'all',

        editing: false,

        selectedArticleId: null,

        editorFocused: false,

        savedRange: null,

        tagInput: '',

        autosaveTimer: null,

        autosaveEnabled: true,

        lastSavedAt: null,

        stats: {
            total: 0,
            published: 0,
            draft: 0,
            views: 0
        },


        /* =====================================================
           MODALS
        ====================================================== */

        linkModal: false,

        imageModal: false,

        categoryModal: false,

        previewModal: false,


        /* =====================================================
           MODAL DATA
        ====================================================== */

        linkForm: {
            text: '',
            url: '',
            target: '',
            nofollow: false,
            noopener: true
        },

        imageForm: {
            url: '',
            alt: '',
            caption: '',
            link: ''
        },

        newCategory: {
            name: '',
            slug: ''
        },

        previewArticleData: {},


        /* =====================================================
           FORM
        ====================================================== */

        form: {
            title: '',
            slug: '',
            excerpt: '',
            content: '',
            featured_image: '',
            category_id: '',
            author_name: 'Cyberind.id',
            status: 'draft',
            seo_title: '',
            seo_description: '',
            publishDate: ''
        },


        /* =====================================================
           INIT
        ====================================================== */

        async init() {

            this.applyTheme();

            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();

            if (session) {

                await this.afterLogin(session);

            }


            supabaseClient.auth.onAuthStateChange(
                async (event, session) => {

                    if (
                        event === 'SIGNED_IN' &&
                        session
                    ) {

                        await this.afterLogin(session);

                    }

                    if (
                        event === 'SIGNED_OUT'
                    ) {

                        this.loggedIn = false;

                    }

                }
            );

        },


        /* =====================================================
           AUTH
        ====================================================== */

        async login() {

            this.loading = true;

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: this.loginEmail.trim(),
                        password: this.loginPassword
                    });

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    throw new Error('Session login tidak ditemukan.');
                }

                await this.afterLogin(data.session);

                this.toastMessage(
                    'Login berhasil.',
                    'success'
                );

            } catch (error) {

                this.toastMessage(
                    error.message || 'Login gagal.',
                    'error'
                );

            } finally {

                this.loading = false;

            }

        },


        async afterLogin(session) {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from('admin_users')
                        .select('user_id')
                        .eq(
                            'user_id',
                            session.user.id
                        )
                        .maybeSingle();

                if (error) {
                    throw error;
                }

                if (!data) {

                    await supabaseClient.auth.signOut();

                    throw new Error(
                        'Akun berhasil login, tetapi tidak terdaftar sebagai admin.'
                    );

                }

                this.loggedIn = true;

                this.userEmail =
                    session.user.email || '';

                await this.loadAll();

            } catch (error) {

                this.loggedIn = false;

                this.toastMessage(
                    error.message,
                    'error'
                );

            }

        },


        async logout() {

            await supabaseClient.auth.signOut();

            this.loggedIn = false;

            this.userEmail = '';

            this.currentPage = 'dashboard';

        },


        /* =====================================================
           LOAD ALL
        ====================================================== */

        async loadAll() {

            await Promise.all([
                this.loadArticles(),
                this.loadCategories(),
                this.loadTags()
            ]);

            this.calculateStats();

        },


        /* =====================================================
           ARTICLES
        ====================================================== */

        async loadArticles() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from('articles')
                    .select(`
                        id,
                        title,
                        slug,
                        excerpt,
                        content,
                        featured_image,
                        category_id,
                        author_name,
                        status,
                        seo_title,
                        seo_description,
                        views,
                        published_at,
                        created_at,
                        updated_at
                    `)
                    .order(
                        'created_at',
                        {
                            ascending: false
                        }
                    );

            if (error) {

                this.toastMessage(
                    error.message,
                    'error'
                );

                return;

            }

            this.articles = data || [];

            this.calculateStats();

        },


        /* =====================================================
           CATEGORIES
        ====================================================== */

        async loadCategories() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from('categories')
                    .select('id,name,slug')
                    .order(
                        'name',
                        {
                            ascending: true
                        }
                    );

            if (error) {

                this.toastMessage(
                    error.message,
                    'error'
                );

                return;

            }

            this.categories = data || [];

        },


        /* =====================================================
           TAGS
        ====================================================== */

        async loadTags() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from('tags')
                    .select('id,name,slug')
                    .order(
                        'name',
                        {
                            ascending: true
                        }
                    );

            if (error) {

                this.toastMessage(
                    error.message,
                    'error'
                );

                return;

            }

            this.tags = data || [];

        },


        /* =====================================================
           STATS
        ====================================================== */

        calculateStats() {

            this.stats.total =
                this.articles.length;

            this.stats.published =
                this.articles.filter(
                    a => a.status === 'published'
                ).length;

            this.stats.draft =
                this.articles.filter(
                    a => a.status === 'draft'
                ).length;

            this.stats.views =
                this.articles.reduce(
                    (sum, a) =>
                        sum + Number(a.views || 0),
                    0
                );

        },


        /* =====================================================
           FILTER
        ====================================================== */

        get filteredArticles() {

            const query =
                this.search
                    .trim()
                    .toLowerCase();

            return this.articles.filter(article => {

                const matchesSearch =
                    !query ||
                    article.title
                        ?.toLowerCase()
                        .includes(query) ||
                    article.slug
                        ?.toLowerCase()
                        .includes(query) ||
                    article.excerpt
                        ?.toLowerCase()
                        .includes(query);

                const matchesStatus =
                    this.statusFilter === 'all' ||
                    article.status === this.statusFilter;

                const matchesCategory =
                    this.categoryFilter === 'all' ||
                    article.category_id === this.categoryFilter;

                return (
                    matchesSearch &&
                    matchesStatus &&
                    matchesCategory
                );

            });

        },


        /* =====================================================
           NAVIGATION
        ====================================================== */

        navigate(page) {

            this.currentPage = page;

            this.mobileMenu = false;

            const titles = {

                dashboard: 'Dashboard',

                posts: 'Semua Artikel',

                editor: 'Editor Artikel',

                categories: 'Kategori',

                tags: 'Tags',

                media: 'Media'

            };

            this.pageTitle =
                titles[page] || 'Cyberind CMS';

        },


        /* =====================================================
           NEW ARTICLE
        ====================================================== */

        newArticle() {

            this.editing = false;

            this.selectedArticleId = null;

            this.form = {

                title: '',

                slug: '',

                excerpt: '',

                content: '',

                featured_image: '',

                category_id: '',

                author_name: 'Cyberind.id',

                status: 'draft',

                seo_title: '',

                seo_description: '',

                publishDate: ''

            };

            this.tagInput = '';

            this.navigate('editor');

            this.$nextTick(() => {

                const editor =
                    document.getElementById(
                        'visualEditor'
                    );

                if (editor) {

                    editor.innerHTML = '';

                    editor.focus();

                }

            });

        },


        /* =====================================================
           EDIT ARTICLE
        ====================================================== */

        async editArticle(article) {

            this.editing = true;

            this.selectedArticleId =
                article.id;

            this.form = {

                title: article.title || '',

                slug: article.slug || '',

                excerpt: article.excerpt || '',

                content: article.content || '',

                featured_image:
                    article.featured_image || '',

                category_id:
                    article.category_id || '',

                author_name:
                    article.author_name ||
                    'Cyberind.id',

                status:
                    article.status || 'draft',

                seo_title:
                    article.seo_title || '',

                seo_description:
                    article.seo_description || '',

                publishDate:
                    this.toDatetimeLocal(
                        article.published_at
                    )

            };

            this.tagInput =
                await this.getArticleTags(
                    article.id
                );

            this.navigate('editor');

            this.$nextTick(() => {

                const editor =
                    document.getElementById(
                        'visualEditor'
                    );

                if (editor) {

                    editor.innerHTML =
                        this.sanitizeHTML(
                            this.form.content
                        );

                }

            });

        /* =====================================================
           AUTO SLUG
        ====================================================== */

        autoSlug() {

            if (
                !this.editing ||
                !this.form.slug
            ) {

                this.form.slug =
                    this.slugify(
                        this.form.title
                    );

            }

            if (!this.form.seo_title) {

                this.form.seo_title =
                    this.form.title;

            }

        },


        /* =====================================================
           SLUGIFY
        ====================================================== */

        slugify(text) {

            return (text || '')
                .toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-+|-+$/g, '');

        },


        /* =====================================================
           EDITOR
        ====================================================== */

        editorInput() {

            const editor =
                document.getElementById(
                    'visualEditor'
                );

            if (!editor) {
                return;
            }

            this.form.content =
                this.sanitizeHTML(
                    editor.innerHTML
                );

            this.scheduleAutosave();

        },


        saveSelection() {

            const selection =
                window.getSelection();

            if (
                selection &&
                selection.rangeCount > 0
            ) {

                const range =
                    selection.getRangeAt(0);

                const editor =
                    document.getElementById(
                        'visualEditor'
                    );

                if (
                    editor &&
                    editor.contains(
                        range.commonAncestorContainer
                    )
                ) {

                    this.savedRange =
                        range.cloneRange();

                }

            }

        },


        restoreSelection() {

            if (!this.savedRange) {
                return;
            }

            const selection =
                window.getSelection();

            selection.removeAllRanges();

            selection.addRange(
                this.savedRange
            );

        },


        command(command, value = null) {

            this.restoreSelection();

            document.execCommand(
                command,
                false,
                value
            );

            this.editorInput();

            this.saveSelection();

        },


        formatBlock(tag) {

            if (!tag) {
                return;
            }

            this.restoreSelection();

            document.execCommand(
                'formatBlock',
                false,
                `<${tag}>`
            );

            this.editorInput();

        },


        /* =====================================================
           LINK MODAL
        ====================================================== */

        openLinkModal() {

            this.saveSelection();

            const selection =
                window.getSelection();

            let text = '';

            if (
                selection &&
                selection.rangeCount
            ) {

                text =
                    selection
                        .toString();

            }

            let existingLink = null;

            if (
                selection &&
                selection.anchorNode
            ) {

                let node =
                    selection.anchorNode;

                if (
                    node.nodeType ===
                    Node.TEXT_NODE
                ) {

                    node =
                        node.parentElement;

                }

                if (
                    node &&
                    node.closest
                ) {

                    existingLink =
                        node.closest('a');

                }

            }

            this.linkForm = {

                text:
                    existingLink?.textContent ||
                    text ||
                    '',

                url:
                    existingLink?.getAttribute('href') ||
                    '',

                target:
                    existingLink?.getAttribute('target') ||
                    '',

                nofollow:
                    (
                        existingLink?.getAttribute('rel') ||
                        ''
                    ).includes('nofollow'),

                noopener:
                    (
                        existingLink?.getAttribute('rel') ||
                        ''
                    ).includes('noopener')

            };

            this.linkModal = true;

        },


        closeLinkModal() {

            this.linkModal = false;

        },


        insertLink() {

            const url =
                this.linkForm.url.trim();

            if (!url) {

                this.toastMessage(
                    'URL link wajib diisi.',
                    'error'
                );

                return;

            }

            this.restoreSelection();

            const selection =
                window.getSelection();

            let text =
                this.linkForm.text.trim();

            if (
                !text &&
                selection
            ) {

                text =
                    selection.toString();

            }

            if (!text) {
                text = url;
            }

            const safeUrl =
                this.sanitizeURL(url);

            if (!safeUrl) {

                this.toastMessage(
                    'URL tidak valid atau berbahaya.',
                    'error'
                );

                return;

            }

            let rel = [];

            if (this.linkForm.nofollow) {
                rel.push('nofollow');
            }

            if (this.linkForm.noopener) {
                rel.push(
                    'noopener',
                    'noreferrer'
                );
            }

            const attrs = [

                `href="${this.escapeAttribute(safeUrl)}"`,

                this.linkForm.target === '_blank'
                    ? 'target="_blank"'
                    : '',

                rel.length
                    ? `rel="${rel.join(' ')}"`
                    : ''

            ].filter(Boolean).join(' ');

            const html =
                `<a ${attrs}>${this.escapeHTML(text)}</a>`;

            document.execCommand(
                'insertHTML',
                false,
                html
            );

            this.editorInput();

            this.linkModal = false;

            this.toastMessage(
                'Link berhasil dimasukkan.',
                'success'
            );

        },

        /* =====================================================
           STORAGE
        ====================================================== */

        async uploadToStorage(file) {

            const allowedTypes = [

                'image/jpeg',

                'image/png',

                'image/webp',

                'image/gif'

            ];

            if (
                !allowedTypes.includes(
                    file.type
                )
            ) {

                throw new Error(
                    'Format gambar harus JPG, PNG, WEBP, atau GIF.'
                );

            }

            if (
                file.size >
                5 * 1024 * 1024
            ) {

                throw new Error(
                    'Ukuran gambar maksimal 5 MB.'
                );

            }

            const extension =
                (
                    file.name
                        .split('.')
                        .pop() ||
                    'jpg'
                ).toLowerCase();

            const uuid =
                crypto?.randomUUID
                    ? crypto.randomUUID()
                    : Date.now() +
                      '-' +
                      Math.random()
                          .toString(16)
                          .slice(2);

            const path =
                `articles/${uuid}.${extension}`;

            const {
                error
            } =
                await supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .upload(
                        path,
                        file,
                        {
                            cacheControl: '31536000',
                            upsert: false,
                            contentType: file.type
                        }
                    );

            if (error) {

                throw new Error(
                    `Upload gagal: ${error.message}. Pastikan bucket "${STORAGE_BUCKET}" sudah dibuat dan policy Storage sudah aktif.`
                );

            }

            const {
                data
            } =
                supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .getPublicUrl(path);

            return data.publicUrl;

        },


        async uploadMediaLibrary(event) {

            const file =
                event.target.files?.[0];

            if (!file) {
                return;
            }

            try {

                const url =
                    await this.uploadToStorage(

                    );

                this.mediaItems.unshift(url);

                this.toastMessage(

                    'success'
                );

            } catch (error) {

                this.toastMessage(
                    error.message,
                    'error'
                );

            }

            event.target.value = '';

        },


        /* =====================================================
           SAVE ARTICLE
        ====================================================== */

        async saveArticle(forceStatus = null) {

            if (
                !this.form.title.trim()
            ) {

                this.toastMessage(
                    'Judul artikel wajib diisi.',
                    'error'
                );

                return;

            }

            const editor =
                document.getElementById(
                    'visualEditor'
                );

            if (editor) {

                this.form.content =
                    this.sanitizeHTML(
                        editor.innerHTML
                    );

            }

            if (
                !this.form.content.trim()
            ) {

                this.toastMessage(
                    'Konten artikel masih kosong.',
                    'error'
                );

                return;

            }

            if (!this.form.slug) {

                this.form.slug =
                    this.slugify(
                        this.form.title
                    );

            }

            if (!this.form.seo_title) {

                this.form.seo_title =
                    this.form.title;

            }

            const status =
                forceStatus ||
                this.form.status;

            let publishedAt =
                null;

            if (status === 'published') {

                if (
                    this.form.publishDate
                ) {

                    publishedAt =
                        new Date(
                            this.form.publishDate
                        ).toISOString();

                } else {

                    const existing =
                        this.articles.find(
                            a =>
                                a.id ===
                                this.selectedArticleId
                        );

                    publishedAt =
                        existing?.published_at ||
                        new Date().toISOString();

                }

            }

            this.saving = true;

            try {

                const payload = {

                    title:
                        this.form.title.trim(),

                    slug:
                        this.form.slug.trim(),

                    excerpt:
                        this.form.excerpt.trim(),

                    content:
                        this.sanitizeHTML(
                            this.form.content
                        ),

                    featured_image:
                        this.form.featured_image ||
                        null,

                    category_id:
                        this.form.category_id ||
                        null,

                    author_name:
                        this.form.author_name.trim() ||
                        'Cyberind.id',

                    status,

                    seo_title:
                        this.form.seo_title.trim() ||
                        null,

                    seo_description:
                        this.form.seo_description.trim() ||
                        null,

                    published_at:
                        publishedAt,

                    updated_at:
                        new Date().toISOString()

                };


                /* =================================================
                   INSERT
                ================================================== */

                if (!this.editing) {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .from('articles')
                            .insert(payload)
                            .select()
                            .single();

                    if (error) {
                        throw error;
                    }

                    this.selectedArticleId =
                        data.id;

                    this.editing = true;

                }


                /* =================================================
                   UPDATE
                ================================================== */

                else {

                    const {
                        error
                    } =
                        await supabaseClient
                            .from('articles')
                            .update(payload)
                            .eq(
                                'id',
                                this.selectedArticleId
                            );

                    if (error) {
                        throw error;
                    }

                }


                /* =================================================
                   TAGS
                ================================================== */

                await this.saveTags(
                    this.selectedArticleId
                );


                await this.loadArticles();

                await this.loadTags();

                this.calculateStats();

                this.lastSavedAt =
                    new Date();


                this.toastMessage(
                    status === 'published'
                        ? 'Artikel berhasil dipublikasikan.'
                        : 'Draft berhasil disimpan.',
                    'success'
                );


                this.form.status =
                    status;


            } catch (error) {

                if (
                    error.code ===
                    '23505'
                ) {

                    this.toastMessage(
                        'Slug sudah digunakan. Silakan gunakan slug lain.',
                        'error'
                    );

                } else {

                    this.toastMessage(
                        error.message ||
                        'Gagal menyimpan artikel.',
                        'error'
                    );

                }

            } finally {

                this.saving = false;

            }

        },


        /* =====================================================
           TAGS
        ====================================================== */

        async getArticleTags(articleId) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from('article_tags')
                    .select(`
                        tag_id,
                        tags (
                            name
                        )
                    `)
                    .eq(
                        'article_id',
                        articleId
                    );

            if (error) {

                console.warn(error);

                return '';

            }

            return (data || [])
                .map(
                    item =>
                        item.tags?.name
                )
                .filter(Boolean)
                .join(', ');

        },


        async saveTags(articleId) {

            const raw =
                this.tagInput
                    .split(',')
                    .map(
                        item =>
                            item.trim()
                    )
                    .filter(Boolean);

            const unique =
                [
                    ...new Set(
                        raw.map(
                            item =>
                                item.toLowerCase()
                        )
                    )
                ];

            const {
                error: deleteError
            } =
                await supabaseClient
                    .from('article_tags')
                    .delete()
                    .eq(
                        'article_id',
                        articleId
                    );

            if (deleteError) {
                throw deleteError;
            }

            for (const tagName of unique) {

                const slug =
                    this.slugify(
                        tagName
                    );

                let {
                    data: existing
                } =
                    await supabaseClient
                        .from('tags')
                        .select('id')
                        .eq(
                            'slug',
                            slug
                        )
                        .maybeSingle();

                if (!existing) {

                    const {
                        data: inserted,
                        error
                    } =
                        await supabaseClient
                            .from('tags')
                            .insert({
                                name: tagName,
                                slug
                            })
                            .select('id')
                            .single();

                    if (error) {

                        if (
                            error.code ===
                            '23505'
                        ) {

                            const {
                                data: retry
                            } =
                                await supabaseClient
                                    .from('tags')
                                    .select('id')
                                    .eq(
                                        'slug',
                                        slug
                                    )
                                    .single();

                            existing =
                                retry;

                        } else {

                            throw error;

                        }

                    } else {

                        existing =
                            inserted;

                    }

                }

                if (!existing?.id) {
                    continue;
                }

                const {
                    error: relationError
                } =
                    await supabaseClient
                        .from('article_tags')
                        .insert({
                            article_id:
                                articleId,
                            tag_id:
                                existing.id
                        });

                if (relationError) {

                    if (
                        relationError.code !==
                        '23505'
                    ) {

                        throw relationError;

                    }

                }

            }

        },

           DELETE
        ====================================================== */

        async deleteArticle(article) {

            const confirmed =
                confirm(
                    `Yakin ingin menghapus artikel "${article.title}"?`

            try {

                this.toastMessage(

                );

            } catch (error) {

                    'error'
                );

            }

        },

        /* =====================================================
           SANITIZATION
        ====================================================== */

        sanitizeHTML(html) {

            if (
                typeof DOMPurify ===
                'undefined'
            ) {

                return html || '';

            }

            return DOMPurify.sanitize(
                html || '',
                {

                    USE_PROFILES: {
                        html: true
                    },

                    FORBID_TAGS: [

                        'script',

                        'iframe',

                        'object',

                        'embed',

                        'form',

                        'input',

                        'button',

                        'textarea',

                        'select',

                        'style',

                        'meta',

                        'link'

                    ],

                    FORBID_ATTR: [

                        'onerror',

                        'onload',

                        'onclick',

                        'onmouseover',

                        'onfocus',

                        'onblur',

                        'srcdoc'

                    ]

                }
            );

        },


        sanitizeURL(url) {

            if (!url) {
                return null;
            }

            const value =
                url.trim();

            if (
                value.startsWith('/')
            ) {

                return value;

            }

            if (
                value.startsWith('#')
            ) {

                return value;

            }

            if (
                value.startsWith('?')
            ) {

                return value;

            }

            try {

                const parsed =
                    new URL(
                        value,
                        window.location.origin
                    );

                const allowed = [

                    'http:',

                    'https:',

                    'mailto:'

                ];

                if (
                    !allowed.includes(
                        parsed.protocol
                    )
                ) {

                    return null;

                }

                return value;

            } catch {

                return null;

            }

        },


        escapeHTML(text) {

            return String(text || '')
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        },


        escapeAttribute(text) {

            return this.escapeHTML(text);

        },


        /* =====================================================
           MEDIA / CLIPBOARD
        ====================================================== */

        async copyText(text) {

            try {

                await navigator.clipboard.writeText(
                    text
                );

                this.toastMessage(
                    'URL berhasil disalin.',
                    'success'
                );

            } catch {

                this.toastMessage(
                    'Tidak dapat menyalin URL.',
                    'error'
                );

            }

        },


        /* =====================================================
           HELPERS
        ====================================================== */

        categoryName(id) {

            if (!id) {
                return 'Tanpa kategori';
            }

            return (
                this.categories.find(
                    category =>
                        category.id === id
                )?.name ||
                'Tanpa kategori'
            );

        },


        formatDate(date) {

            if (!date) {
                return '-';
            }

            return new Intl.DateTimeFormat(
                'id-ID',
                {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                }
            ).format(
                new Date(date)
            );

        },


        toDatetimeLocal(date) {

            if (!date) {
                return '';
            }

            const d =
                new Date(date);

            const pad =
                number =>
                    String(number)
                        .padStart(2, '0');

            return (
                d.getFullYear() +
                '-' +
                pad(d.getMonth() + 1) +
                '-' +
                pad(d.getDate()) +
                'T' +
                pad(d.getHours()) +
                ':' +
                pad(d.getMinutes())
            );

        },


        toast: {

            show: false,

            type: 'info',

            message: ''

        },


        toastMessage(
            message,
            type = 'info'
        ) {

            this.toast = {

                show: true,

                type,

                message

            };

            setTimeout(
                () => {

                    this.toast.show =
                        false;

                },
                3500
            );

        },


        /* =====================================================
           THEME
        ====================================================== */

        applyTheme() {

            document.documentElement.classList.toggle(
                'dark',
                this.darkMode
            );

            localStorage.setItem(
                'cyberind_cms_dark',
                this.darkMode
            );

        },


        get wordCount() {

            const temp =
                document.createElement(
                    'div'
                );

            temp.innerHTML =
                this.form.content || '';

            const text =
                temp.textContent ||
                temp.innerText ||
                '';

            return text
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .length;

        },


        get characterCount() {

            const temp =
                document.createElement(
                    'div'
                );

            temp.innerHTML =
                this.form.content || '';

            return (
                temp.textContent ||
                ''
            ).length;

        }

    };

}

</script>
