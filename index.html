<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberind Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Container Terminal dengan Efek Glassmorphism */
        .terminal {
            position: relative;
            width: 600px;
            max-width: 90%;
            background: rgba(15, 23, 42, 0.45); /* Transparan */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            color: #00ff66; /* Warna teks terminal hijau ala hacker/cyber */
        }

        /* Logo Samar di Tengah (Background Logo) */
        .terminal::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: url('https://www.cyberind.my.id/assets/images/logoo.png') no-repeat center center;
            background-size: contain;
            opacity: 0.08; /* Efek samar/transparan */
            z-index: 0;
            pointer-events: none;
        }

        /* Header Terminal */
        .terminal-header {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .btn-red { background: #ff5f56; }
        .btn-yellow { background: #ffbd2e; }
        .btn-green { background: #27c93f; }

        .title {
            margin-left: 15px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Body / Isi Terminal Menurun Ke Bawah */
        .terminal-body {
            padding: 20px;
            font-size: 14px;
            line-height: 1.8;
            position: relative;
            z-index: 1;
        }

        .line {
            display: block;
            margin-bottom: 6px;
            text-shadow: 0 0 5px rgba(0, 255, 102, 1);
        }

        .prompt-link {
            color: #00ffff;
            text-decoration: none;
        }

        .prompt-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="terminal">
        <!-- Header Terminal -->
        <div class="terminal-header">
            <div class="buttons">
                <div class="btn btn-red"></div>
                <div class="btn btn-yellow"></div>
                <div class="btn btn-green"></div>
            </div>
            <div class="title">root@cyberind:~</div>
        </div>

        <!-- Isi Terminal (Menurun ke Bawah) -->
        <div class="terminal-body">
            <span class="line">$ ./cyberind --launch</span>
            <span class="line">./root@j1337 [OK] CONNECTED.......</span>
            <span class="line">./root@j1337 [OK] SECURE.......</span>
            <span class="line">./root@j1337 [OK] LOADED.......</span>
            <span class="line">./root@j1337 ACCESS GRANTED.......</span>
            <span class="line">&gt; <a href="https://cyberind.my.id" class="prompt-link" target="_blank">cyberind.my.id</a></span>
        </div>
    </div>

</body>
</html>
