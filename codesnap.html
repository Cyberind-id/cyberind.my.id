<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSnap Generator</title>
    <!-- Tailwind CSS untuk Styling Cepat -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Highlight.js untuk Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- html2canvas untuk Export Gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Custom scrollbar untuk preview */
        textarea::-webkit-scrollbar, pre::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        textarea::-webkit-scrollbar-thumb, pre::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Panel Kontrol / Settings -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl flex flex-col justify-between border border-slate-700">
            <div class="space-y-4">
                <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    CodeSnap Settings
                </h1>

                <!-- Input Kode -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Source Code</label>
                    <textarea id="code-input" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 font-mono resize-y" placeholder="Tulis atau paste kodenya di sini...">function greeting(name) {
    console.log(`Hello, ${name}!`);
}
greeting("Ahmat Badali");</textarea>
                </div>

                <!-- Pilihan Tema Background -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Background Gradient</label>
                    <select id="bg-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="from-indigo-500 via-purple-500 to-pink-500">Indigo - Purple - Pink</option>
                        <option value="from-blue-600 to-violet-600">Blue - Violet</option>
                        <option value="from-emerald-400 to-cyan-500">Emerald - Cyan</option>
                        <option value="from-amber-500 to-rose-600">Amber - Rose</option>
                        <option value="from-slate-700 to-slate-900">Dark Slate</option>
                    </select>
                </div>

                <!-- Opsi Tampilan Window -->
                <div class="space-y-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-window-controls" checked class="rounded bg-slate-900 border-slate-700 text-indigo-500 focus:ring-indigo-500">
                        <span class="text-sm text-slate-300">Tampilkan Tombol Jendela (Mac Style)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-line-numbers" class="rounded bg-slate-900 border-slate-700 text-indigo-500 focus:ring-indigo-500">
                        <span class="text-sm text-slate-300">Tampilkan Nomor Baris</span>
                    </label>
                </div>

                <!-- Tombol Export -->
                <button id="export-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download Gambar
                </button>
            </div>

            <!-- Footer / Watermark Info -->
            <div class="mt-6 pt-4 border-t border-slate-700 text-center text-xs text-slate-400">
                Created by <a href="https://ahmatbadali.my.id" target="_blank" class="text-indigo-400 hover:underline font-medium">@Ahmat Badali</a>
            </div>
        </div>

        <!-- Panel Preview (Menyesuaikan dengan Isi Kode) -->
        <div class="lg:col-span-2 flex items-center justify-center bg-slate-950/50 p-6 rounded-2xl border border-slate-800 overflow-auto">
            
            <!-- Wrapper Container dengan Background Gradient -->
            <div id="capture" class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-8 rounded-2xl shadow-2xl transition-all duration-300 max-w-full">
                
                <!-- Jendela Kode (Ukuran Dinamis Menyesuaikan Konten) -->
                <div class="bg-slate-900/90 backdrop-blur-md rounded-xl shadow-2xl border border-slate-700/50 overflow-hidden w-auto inline-block min-w-[280px] max-w-full">
                    
                    <!-- Header Jendela -->
                    <div id="window-header" class="px-4 py-3 bg-slate-900/50 flex items-center justify-between border-b border-slate-800">
                        <div id="window-controls" class="flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                            <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                            <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                        </div>
                        <div class="text-xs text-slate-400 font-mono">script.js</div>
                        <div class="w-10"></div> <!-- Spacer keseimbangan header -->
                    </div>

                    <!-- Isi Konten Kode -->
                    <div class="p-4 overflow-x-auto">
                        <pre class="m-0 font-mono text-sm leading-relaxed"><code id="code-output" class="language-javascript"></code></pre>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- Script Logika Interaktif -->
    <script>
        const codeInput = document.getElementById('code-input');
        const codeOutput = document.getElementById('code-output');
        const bgSelect = document.getElementById('bg-select');
        const captureArea = document.getElementById('capture');
        const showWindowControls = document.getElementById('show-window-controls');
        const windowHeader = document.getElementById('window-header');
        const showLineNumbers = document.getElementById('show-line-numbers');
        const exportBtn = document.getElementById('export-btn');

        function updatePreview() {
            const rawCode = codeInput.value;
            codeOutput.textContent = rawCode;
            
            // Set highlight ulang
            hljs.highlightElement(codeOutput);
        }

        // Event listener input kode
        codeInput.addEventListener('input', updatePreview);

        // Event listener ganti background
        bgSelect.addEventListener('change', (e) => {
            captureArea.className = `bg-gradient-to-br ${e.target.value} p-8 rounded-2xl shadow-2xl transition-all duration-300 max-w-full`;
        });

        // Toggle kontrol jendela Mac
        showWindowControls.addEventListener('change', (e) => {
            windowHeader.style.display = e.target.checked ? 'flex' : 'none';
        });

        // Fitur Export Gambar menggunakan html2canvas
        exportBtn.addEventListener('click', () => {
            exportBtn.textContent = "Memproses...";
            exportBtn.disabled = true;

            html2canvas(captureArea, {
                scale: 2, // Kualitas gambar lebih tajam (Retina)
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'codesnap-output.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                exportBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download Gambar
                `;
                exportBtn.disabled = false;
            }).catch(err => {
                console.error("Gagal export gambar:", err);
                exportBtn.textContent = "Gagal, Coba Lagi";
                exportBtn.disabled = false;
            });
        });

        // Inisialisasi awal saat halaman dimuat
        updatePreview();
    </script>
</body>
</html>
